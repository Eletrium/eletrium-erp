    /* ==================================================================
       REABRIR PROPOSTA (comando ReabrirProposta, §25 do relatório G2 —
       schema e fluxo TRAVADOS, ao contrário do Tipo_Entrega de Venda Ganha
       que era palpite). Comando ainda NÃO existe no backend (Power Apps
       V2) — mesmo padrão de STUB rotulado, lock explícito e funções puras
       testadas do item 1.

       Idempotency_Key: gerada na ABERTURA DO DIÁLOGO (não determinística —
       a mesma Proposta pode ser reaberta mais de uma vez legitimamente,
       cada abertura do diálogo é uma tentativa nova com chave própria).
       Mantida durante toda a tentativa, incluindo o 2º round-trip do fluxo
       de vínculo abaixo (mesma tentativa, mesma chave).

       FLUXO EM 2 FASES (passo 6 da especificação): o frontend NÃO sabe de
       antemão se a proposta tem vínculo confirmado em Venda_Ganha_Registros
       — só o backend sabe. O primeiro submit pode voltar com
       Codigo_Erro=CONFIRMACAO_PROJETO_VINCULADO_AUSENTE; só então o campo
       de confirmação aparece e um segundo submit (MESMA Idempotency_Key)
       é feito com Confirmacao_Projeto_Vinculado=true.

       Responsavel NÃO é input do comando (vem do usuário autenticado no
       backend) — por isso não entra no payload, diferente de Venda Ganha.
       ================================================================== */
    const ETAPAS_DESTINO_REABERTURA = ["Em Negociação", "Aguardando Decisão"];
    const MOTIVOS_REABERTURA = ["Cliente cancelou após fechamento", "Erro de lançamento", "Nova rodada de negociação", "Outro"];
    const exigeDetalheReabertura = (categoria) => categoria === "Outro";
    // só Ganho/Perdido são reabríveis (passo 3 do fluxo) — nunca uma etapa ativa.
    const etapaReabrivel = (etapa) => etapa === "Ganho" || etapa === "Perdido";

    function gerarIdempotencyKeyReabertura() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
      return "idem-reab-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
    }

    // validação pura — cobre os passos 4/5/6 do fluxo do lado do cliente.
    function validarReabrirProposta(d) {
      const faltando = [];
      if (!ETAPAS_DESTINO_REABERTURA.includes(d.etapaDestino)) faltando.push("Etapa de destino (confirme ou escolha)");
      if (!MOTIVOS_REABERTURA.includes(d.categoria)) faltando.push("Motivo da reabertura");
      if (exigeDetalheReabertura(d.categoria) && (!d.detalhe || !String(d.detalhe).trim()))
        faltando.push("Detalhe do motivo (obrigatório para \"Outro\")");
      if (d.exigeConfirmacaoVinculo && !d.confirmacaoVinculo)
        faltando.push("Confirmação de vínculo com Projeto/OS");
      return { ok: faltando.length === 0, faltando: faltando };
    }

    // monta o payload EXATO do comando (§25.2) — nomes literais da spec, não
    // convenção neutra minha (diferente do payload de Venda Ganha).
    function montarPayloadReabrirProposta(p, d, idempotencyKey) {
      const payload = {
        Proposta_ID: p.id,
        Idempotency_Key: idempotencyKey,
        Etapa_Destino: d.etapaDestino,
        Motivo_Reabertura_Categoria: d.categoria
      };
      if (exigeDetalheReabertura(d.categoria)) payload.Motivo_Reabertura_Detalhe = String(d.detalhe || "").trim();
      if (d.exigeConfirmacaoVinculo) payload.Confirmacao_Projeto_Vinculado = !!d.confirmacaoVinculo;
      return payload;
    }

    // ---- CHAMADA MOCKADA (STUB) — comando real ainda não existe no backend ----
    // Simula o passo 1 (idempotência: replay se a chave já existir) e o passo 6
    // (vínculo de Projeto/OS — só propostas que estavam em "Ganho" passam por
    // Venda_Ganha_Registros). Como o schema real não existe, a simulação
    // assume "vínculo confirmado encontrado" toda vez que a etapa anterior é
    // Ganho e a confirmação ainda não veio — isso FORÇA o fluxo de 2 fases a
    // ser exercitado de verdade em vez de sempre ter sucesso de primeira.
    let respostasIdempotentesStub = {};
    async function reabrirPropostaStub(payload, fieldsAtuais) {
      await new Promise((r) => setTimeout(r, 500)); // simula latência de rede
      const key = payload.Idempotency_Key;
      if (respostasIdempotentesStub[key]) {
        console.info("[reabrir-proposta][STUB] replay idempotente reconhecido pra", key);
        return Object.assign({}, respostasIdempotentesStub[key], { Foi_Replay_Idempotente: true });
      }
      console.info("[reabrir-proposta][STUB] payload que seria enviado ao comando ReabrirProposta:", payload);

      const etapaAnterior = (fieldsAtuais || {}).Etapa_Pipeline;
      if (etapaAnterior === "Ganho" && !payload.Confirmacao_Projeto_Vinculado) {
        return {
          Sucesso: false,
          Codigo_Erro: "CONFIRMACAO_PROJETO_VINCULADO_AUSENTE",
          Mensagem: "🧪 SIMULAÇÃO: esta proposta estava em Ganho — o STUB simula um vínculo de Projeto/OS confirmado em Venda_Ganha_Registros. Confirme explicitamente pra prosseguir."
        }; // erro NUNCA é cacheado como resposta idempotente (não é o resultado final da tentativa)
      }

      const resp = {
        Sucesso: true,
        Proposta_Historico_ID: "stub-" + Math.random().toString(36).slice(2, 10),
        Idempotency_Key: key,
        Foi_Replay_Idempotente: false,
        Etapa_Anterior: etapaAnterior,
        Etapa_Nova: payload.Etapa_Destino,
        Vinculo_Projeto_Confirmado: etapaAnterior === "Ganho" ? !!payload.Confirmacao_Projeto_Vinculado : false
      };
      respostasIdempotentesStub[key] = resp;
      return resp;
    }

    function blocoReabrirProposta(p) {
      const f = p.fields || {};
      if (!etapaReabrivel(f.Etapa_Pipeline)) return ""; // só Ganho/Perdido — reabertura não se aplica

      const opcoesEtapa = ETAPAS_DESTINO_REABERTURA.map((e) =>
        `<label><input type="radio" name="reEtapaDestino" value="${esc(e)}" /> ${esc(e)}</label>`
      ).join("");
      const opcoesMotivo = ['<option value="">— selecione —</option>']
        .concat(MOTIVOS_REABERTURA.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`)).join("");

      return `
        <div class="grupo">Reabrir proposta</div>
        <button id="reToggle" class="sec" style="margin-top:8px">Reabrir Proposta</button>
        <div id="reForm" class="ed" hidden>
          <div class="l" style="border:0;padding-top:0">
            <span class="sha">proposta: ${esc(f.Title ?? "—")}</span><br>
            <span class="sha">etapa atual: ${esc(f.Etapa_Pipeline ?? "—")}</span>
          </div>
          <div class="grupo" style="margin-top:10px">Etapa de destino — confirme, nunca a etapa inicial</div>
          <div class="vg-tipo-opcoes">${opcoesEtapa}</div>
          <label>Motivo da reabertura <select id="reMotivoCategoria">${opcoesMotivo}</select></label>
          <div id="reDetalheWrap" hidden>
            <label>Detalhe do motivo * <textarea id="reMotivoDetalhe" rows="2" placeholder="motivo &quot;Outro&quot; exige detalhe — obrigatório"></textarea></label>
          </div>
          <div id="reVinculoWrap" hidden>
            <div class="diverge">⚠️ Esta proposta tem vínculo de Projeto/OS confirmado (Venda_Ganha_Registros). Reabrir NÃO desfaz esse vínculo automaticamente.</div>
            <label><input type="checkbox" id="reConfirmacaoVinculo" /> Confirmo que entendo e quero reabrir mesmo assim</label>
          </div>
          <div class="ed-btns" style="margin-top:12px">
            <button id="reConfirmar" disabled>Confirmar Reabertura</button>
            <button id="reCancelar" class="sec">Cancelar</button>
          </div>
          <div id="reMsg" class="ed-msg"></div>
          <div class="motivo-off" style="margin-top:6px">🧪 STUB — o comando ReabrirProposta (§25) ainda não existe no backend. Nada é gravado de verdade; esta chamada simula o fluxo de 9 passos da especificação.</div>
        </div>`;
    }

    let reaberturaIdempotencyKey = null;      // gerada quando o diálogo abre, fixa durante toda a tentativa
    let reaberturaExigeConfirmacaoVinculo = false; // true depois que um submit devolve CONFIRMACAO_PROJETO_VINCULADO_AUSENTE

    function ligarReabrirProposta(p) {
      const tg = $("reToggle"), form = $("reForm");
      if (!tg || !form) return;

      tg.onclick = () => {
        // cada abertura do diálogo é uma TENTATIVA nova (§25.1: "não
        // determinística, a mesma Proposta pode ser reaberta mais de uma
        // vez legitimamente") — chave nova, estado de vínculo reseta.
        reaberturaIdempotencyKey = gerarIdempotencyKeyReabertura();
        reaberturaExigeConfirmacaoVinculo = false;
        $("reVinculoWrap").hidden = true;
        if ($("reConfirmacaoVinculo")) $("reConfirmacaoVinculo").checked = false;
        form.hidden = false; tg.hidden = true;
      };
      $("reCancelar").onclick = () => openDrawer(p); // descarta o rascunho, re-renderiza do estado em memória

      const btnConfirmar = $("reConfirmar");
      const radios = Array.from(form.querySelectorAll('input[name="reEtapaDestino"]'));
      const selectMotivo = $("reMotivoCategoria");

      function dadosAtuais() {
        return {
          etapaDestino: (radios.find((r) => r.checked) || {}).value,
          categoria: selectMotivo.value,
          detalhe: $("reMotivoDetalhe") ? $("reMotivoDetalhe").value : "",
          exigeConfirmacaoVinculo: reaberturaExigeConfirmacaoVinculo,
          confirmacaoVinculo: $("reConfirmacaoVinculo") ? $("reConfirmacaoVinculo").checked : false
        };
      }
      function atualizarEstado() {
        const categoria = selectMotivo.value;
        $("reDetalheWrap").hidden = !exigeDetalheReabertura(categoria);
        btnConfirmar.disabled = !validarReabrirProposta(dadosAtuais()).ok;
      }

      radios.forEach((r) => r.addEventListener("change", atualizarEstado));
      selectMotivo.addEventListener("change", atualizarEstado);
      form.addEventListener("input", (e) => { if (e.target && e.target.id === "reMotivoDetalhe") atualizarEstado(); });
      form.addEventListener("change", (e) => { if (e.target && e.target.id === "reConfirmacaoVinculo") atualizarEstado(); });
      atualizarEstado();

      btnConfirmar.onclick = () => confirmarReabrirProposta(p, dadosAtuais);
    }

    let gravandoReabertura = false;
    async function confirmarReabrirProposta(p, dadosAtuais) {
      if (gravandoReabertura) return;
      const msg = $("reMsg");
      const dados = dadosAtuais();
      const v = validarReabrirProposta(dados);
      if (!v.ok) { msg.className = "ed-msg err"; msg.textContent = "Faltando: " + v.faltando.join(", ") + "."; return; }

      const btns = [$("reConfirmar"), $("reCancelar")];
      try {
        gravandoReabertura = true;
        btns.forEach((b) => { if (b) b.disabled = true; });
        $("reConfirmar").textContent = "Confirmando (STUB)…";
        msg.className = "ed-msg"; msg.textContent = "Validando e montando o payload...";
        const payload = montarPayloadReabrirProposta(p, dados, reaberturaIdempotencyKey);
        const r = await reabrirPropostaStub(payload, p.fields);
        if (r.Sucesso) {
          msg.className = "ed-msg";
          msg.textContent = "🧪 STUB: " + (r.Foi_Replay_Idempotente ? "replay idempotente reconhecido — " : "") +
            "reabertura validada (" + r.Etapa_Anterior + " → " + r.Etapa_Nova + "). Nada foi gravado de verdade — o comando ainda não existe no backend.";
        } else if (r.Codigo_Erro === "CONFIRMACAO_PROJETO_VINCULADO_AUSENTE") {
          reaberturaExigeConfirmacaoVinculo = true;
          $("reVinculoWrap").hidden = false;
          msg.className = "ed-msg err";
          msg.textContent = "⚠️ " + r.Mensagem + " Marque a confirmação abaixo e tente novamente.";
        } else {
          msg.className = "ed-msg err";
          msg.textContent = "Falha (" + r.Codigo_Erro + "): " + r.Mensagem;
        }
      } catch (e) {
        msg.className = "ed-msg err";
        msg.textContent = "Falha no stub (não deveria acontecer): " + e.message;
      } finally {
        gravandoReabertura = false;
        if ($("reCancelar")) $("reCancelar").disabled = false;
        $("reConfirmar").textContent = "Confirmar Reabertura";
        // reabilita o Confirmar só se o formulário validar de novo — pode
        // continuar bloqueado se agora exige confirmação de vínculo que
        // ainda não foi marcada (não reabilitar às cegas aqui).
        if ($("reConfirmar")) $("reConfirmar").disabled = !validarReabrirProposta(dadosAtuais()).ok;
      }
    }

    /* ==================================================================
       EDIÇÃO DE OPERAÇÃO — uma das TRÊS escritas desta tela (as outras
       duas são congelarOferta e registrarAceite, acima). Nenhum dos campos
       editáveis aqui entra no hash da oferta: trocar responsável ou
       próxima ação NÃO invalida aceite nenhum, e isso é intencional.
       Mesmo padrão de os.html (blocoEdicao/ligarEdicao/salvarOS):
         - PATCH via EG.patchItemFields, SÓ com os campos alterados (dirty tracking);
         - releitura do servidor após gravar (nunca confiar no eco local);
         - re-render de drawer + tabela com o estado real.

       DONO DE CAMPO (por que SÓ estes campos são editáveis aqui):
         - Responsavel_Principal, Proxima_Acao, Data_Proxima_Acao, Motivo_Perda,
           Concorrente: SEM escritor automatizado (docs/INVENTARIO-AS-IS.md) —
           o dono é a operação F5, ou seja, ESTA tela.
         - Etapa_Pipeline NÃO é editável aqui: muda pelo Kanban (index.html),
           que carrega o Data_Entrada_Etapa junto — mudar aqui dessincronizaria o SLA.
         - ValorTotal/Valor_Servico/Valor_Materiais/Descricao e os campos de
           documento (Link_Documento_PDF, Data_Geracao_PDF...) têm outros donos
           (nova-proposta.html e o gerador de PDF) — ficam FORA do formulário.
         - Motivo_Perda/Concorrente só fazem sentido (e só aparecem) quando
           Etapa_Pipeline = "Perdido".
       ================================================================== */
    // yyyy-mm-dd para o input date. Data-pura (meia-noite UTC, típico de Date only)
    // usa o próprio AAAA-MM-DD do ISO — converter para local mostraria o dia
    // ANTERIOR em Brasília. (Mesma lógica de os.html.)
    const toDateInput = (s) => {
      if (!s) return ""; const d = new Date(s); if (isNaN(d.getTime())) return "";
      if (EG.ehDataPura(s)) return String(s).slice(0, 10);
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    };
    // normaliza o valor ORIGINAL do item para a mesma forma do input (dirty tracking por string)
    function normOrig(tipo, v) {
      if (tipo === "data") return toDateInput(v);
      return v == null ? "" : String(v); // choice, texto
    }
    // converte o valor do input para o que o Graph grava.
    // NUNCA gravamos "": campo intocado nem entra no payload (dirty tracking);
    // se o usuário APAGOU um valor que existia, isso é limpeza intencional -> null.
    function paraGraph(tipo, val) {
      if (val === "") return null; // limpar de propósito (o skip do não-alterado é o dirty tracking)
      // Data only: meio-dia UTC — a data local fica correta em qualquer fuso plausível
      // (meia-noite UTC viraria o dia ANTERIOR ao ser exibida em Brasília).
      if (tipo === "data") return val + "T12:00:00Z";
      return val;
    }

    // campo -> id do input + tipo (dirige dirty tracking e conversão p/ Graph).
    // Motivo_Perda/Concorrente só existem no DOM quando a etapa é "Perdido" —
    // ligarEdicao/salvarProposta pulam elementos ausentes.
    const CAMPOS_EDIT = [
      { campo: "Responsavel_Principal", el: "pResponsavel",  tipo: "texto" },
      { campo: "Proxima_Acao",          el: "pProximaAcao",  tipo: "texto" },
      { campo: "Data_Proxima_Acao",     el: "pDataProxima",  tipo: "data" },
      { campo: "Motivo_Perda",          el: "pMotivoPerda",  tipo: "choice" },
      { campo: "Concorrente",           el: "pConcorrente",  tipo: "texto" }
    ];

    function blocoEdicao(f) {
      // valores/opções são preenchidos por ligarEdicao() via .value — nada de
      // valor de usuário interpolado em atributo HTML.
      const perdido = f.Etapa_Pipeline === "Perdido";
      return `
        <div class="grupo">Operação</div>
        <button id="pToggle" class="sec" style="margin-top:8px">Editar operação</button>
        <div id="pForm" class="ed" hidden>
          <label>Responsável principal <input type="text" id="pResponsavel" /></label>
          <label>Próxima ação <input type="text" id="pProximaAcao" /></label>
          <label>Data da próxima ação <input type="date" id="pDataProxima" /></label>
          ${perdido ? `
          <label>Motivo da perda <select id="pMotivoPerda"></select></label>
          <label>Concorrente <input type="text" id="pConcorrente" /></label>` : ""}
          <div class="ed-btns">
            <button id="pSalvar">Salvar</button>
            <button id="pCancelar" class="sec">Cancelar</button>
          </div>
          <div id="pMsg" class="ed-msg"></div>
        </div>`;
    }

    // popula um select de Choice com os valores REAIS do SharePoint (choiceProp).
    // Sem colunas carregadas -> select desabilitado (não arriscamos gravar rótulo inventado).
    // Valor legado fora da lista continua visível e selecionável (não some da tela).
    function popularChoice(sel, campo, atual) {
      sel.innerHTML = "";
      const vazio = document.createElement("option");
      vazio.value = ""; vazio.textContent = "(vazio)"; sel.appendChild(vazio);
      const ops = choiceProp[campo];
      const lista = Array.isArray(ops) ? ops.slice() : [];
      if (atual != null && atual !== "" && !lista.includes(atual)) lista.unshift(atual);
      lista.forEach(v => { const op = document.createElement("option"); op.value = v; op.textContent = v; sel.appendChild(op); });
      if (!Array.isArray(ops)) { sel.disabled = true; sel.title = "choices de " + campo + " não carregados — recarregue a página"; }
      sel.value = atual == null ? "" : String(atual);
    }

    function ligarEdicao(p) {
      const f = p.fields || {};
      const tg = $("pToggle"), form = $("pForm");
      if (!tg || !form) return;
      tg.onclick = () => { form.hidden = false; tg.hidden = true; };
      $("pCancelar").onclick = () => openDrawer(p); // descarta o rascunho re-renderizando do estado em memória

      $("pResponsavel").value = f.Responsavel_Principal ?? "";
      $("pProximaAcao").value = f.Proxima_Acao ?? "";
      $("pDataProxima").value = toDateInput(f.Data_Proxima_Acao);
      // só quando Etapa_Pipeline = "Perdido" (senão os elementos nem existem)
      if ($("pMotivoPerda")) popularChoice($("pMotivoPerda"), "Motivo_Perda", f.Motivo_Perda);
      if ($("pConcorrente")) $("pConcorrente").value = f.Concorrente ?? "";

      $("pSalvar").onclick = () => salvarProposta(p);
    }

    let salvandoProp = false;
    async function salvarProposta(p) {
      if (salvandoProp) return;
      const msg = $("pMsg");
      const f = p.fields || {};

      // dirty tracking: só entra no payload o que o usuário efetivamente mudou
      const campos = {};
      CAMPOS_EDIT.forEach(c => {
        const el = $(c.el);
        if (!el || el.disabled) return; // ausente (etapa ≠ Perdido) ou choice sem opções carregadas
        const antes = normOrig(c.tipo, f[c.campo]);
        const agora = el.value;
        if (antes !== agora) campos[c.campo] = paraGraph(c.tipo, agora);
      });
      if (!Object.keys(campos).length) {
        msg.className = "ed-msg"; msg.textContent = "Nada foi alterado.";
        return;
      }

      const btns = [$("pSalvar"), $("pCancelar")];
      try {
        salvandoProp = true;
        btns.forEach(b => { if (b) b.disabled = true; });
        msg.className = "ed-msg"; msg.textContent = "Gravando...";
        await EG.patchItemFields("Propostas", p.id, campos);
        // relê do servidor em vez de confiar no eco local: se algum campo for
        // recusado (Choice inválido, por ex.), a tela mostra o estado REAL.
        const sid = await EG.resolveSite();
        const novo = await EG.gget("/sites/" + sid + "/lists/" + encodeURIComponent("Propostas") + "/items/" + p.id + "?expand=fields");
        itemMap[p.id] = novo;
        const i = todas.findIndex(x => String(x.id) === String(p.id));
        if (i > -1) todas[i] = novo;
        render(todas);
        openDrawer(novo); // volta ao modo leitura já com os dados relidos
        setStatus("Proposta " + ((novo.fields || {}).Title || p.id) + " atualizada (" + Object.keys(campos).join(", ") + ").");
      } catch (e) {
        msg.className = "ed-msg err";
        msg.textContent = "Falha ao gravar: " + e.message;
        btns.forEach(b => { if (b) b.disabled = false; });
      } finally {
        salvandoProp = false;
      }
    }

    /* Exposto para exercitar as regras sem login (a tela não tinha global). */
    window.PROP = { dataChave, hojeChave, ehAtiva, ETAPAS_FINAIS, normOrig, paraGraph,
                    CAMPOS_EDIT, toDateInput, blocoEdicao, shaCurto,
                    sugerirTipoEntrega, valorOfertaCongelada, valorDivergente, validarVendaGanha,
                    montarPayloadVendaGanha, blocoVendaGanha, TIPOS_ENTREGA_VALIDOS,
                    etapaReabrivel, exigeDetalheReabertura, validarReabrirProposta,
                    montarPayloadReabrirProposta, gerarIdempotencyKeyReabertura, blocoReabrirProposta,
                    ETAPAS_DESTINO_REABERTURA, MOTIVOS_REABERTURA, reabrirPropostaStub };

    /* =========================================================================
       SUITE DE ASSERÇÃO (item 12) — PROP.assertRegras(). Regras protegidas:
       (1) Etapa_Pipeline NÃO é editável nesta tela — ela muda pelo Kanban, que
           recarimba Data_Entrada_Etapa junto; editar aqui DESSINCRONIZARIA o
           SLA. Esta é a asserção mais importante do arquivo;
       (2) o dirty tracking compara STRINGS normalizadas, e campo apagado de
           propósito vira null (nunca "");
       (3) data gravada ao MEIO-DIA UTC (meia-noite UTC exibiria o dia anterior
           em Brasília);
       (4) Motivo_Perda/Concorrente só existem no DOM quando a etapa é Perdido;
       (5) proposta ATIVA sem próxima ação é cobrada; Ganho/Perdido não.
       NÃO coberto aqui (exige login/rede e o ledger de ofertas): o veredito de
       aceite×hash congelado — declarado no relatório.
       ========================================================================= */
    window.PROP.assertRegras = function () {
      const falhas = []; let total = 0;
      const ok = (cond, regra) => { total++; if (!cond) falhas.push(regra); };
      const campos = CAMPOS_EDIT.map(c => c.campo);

      // ---- (1) a etapa NÃO se edita aqui ----
      ok(campos.indexOf("Etapa_Pipeline") === -1,
        "DEFEITO GRAVE: Etapa_Pipeline virou editável nesta tela — ela muda pelo Kanban, que recarimba o Data_Entrada_Etapa junto (editar aqui dessincroniza o SLA)");
      ok(campos.indexOf("Data_Entrada_Etapa") === -1,
        "o relógio do SLA (Data_Entrada_Etapa) não pode ser editado à mão");
      ok(campos.join() === "Responsavel_Principal,Proxima_Acao,Data_Proxima_Acao,Motivo_Perda,Concorrente",
        "o conjunto editável desta tela é fechado e conhecido (veio: " + campos.join() + ")");
      ok(CAMPOS_EDIT.every(c => c.campo && c.el && c.tipo),
        "todo campo editável declara campo + elemento + tipo (senão o dirty tracking não sabe converter)");

      // ---- (2) dirty tracking e limpeza intencional ----
      ok(paraGraph("texto", "") === null && paraGraph("data", "") === null && paraGraph("choice", "") === null,
        "campo APAGADO de propósito vira null (limpa no servidor) — nunca \"\"");
      ok(paraGraph("texto", "Fulano") === "Fulano" && paraGraph("choice", "Preço") === "Preço",
        "valor preenchido passa intacto");
      ok(normOrig("texto", null) === "" && normOrig("texto", undefined) === "" && normOrig("choice", null) === "",
        "normOrig: valor ausente no servidor vira '' para comparar com o input vazio (senão tudo pareceria alterado)");
      ok(normOrig("texto", 123) === "123",
        "normOrig: compara sempre como string (número do servidor não pode parecer alteração)");
      ok(normOrig("data", "2026-08-04T12:00:00Z") === "2026-08-04",
        "normOrig: a data do servidor é normalizada para a forma do input date");

      // ---- (3) meio-dia UTC ----
      ok(paraGraph("data", "2026-08-04") === "2026-08-04T12:00:00Z",
        "data é gravada ao MEIO-DIA UTC (meia-noite UTC exibiria o dia anterior em Brasília)");
      ok(toDateInput("2026-08-04T12:00:00Z") === "2026-08-04" && toDateInput("2026-08-04T00:00:00Z") === "2026-08-04",
        "toDateInput: nem o valor gravado por esta tela nem um DateOnly podem escorregar de dia");
      ok(toDateInput("") === "" && toDateInput(null) === "" && toDateInput("lixo") === "",
        "toDateInput: sem data (ou data ilegível) devolve '' — nunca 'Invalid Date'");
      // ida e volta: gravar e reler tem de dar o MESMO dia
      ok(toDateInput(paraGraph("data", "2026-08-04")) === "2026-08-04",
        "ida e volta da data (grava -> relê) tem de devolver exatamente o mesmo dia");

      // ---- (4) campos de perda só quando Perdido ----
      const bPerdido = blocoEdicao({ Etapa_Pipeline: "Perdido" });
      const bAtiva = blocoEdicao({ Etapa_Pipeline: "Qualificado" });
      ok(bPerdido.indexOf("pMotivoPerda") >= 0 && bPerdido.indexOf("pConcorrente") >= 0,
        "etapa Perdido tem de oferecer Motivo da perda e Concorrente");
      ok(bAtiva.indexOf("pMotivoPerda") === -1 && bAtiva.indexOf("pConcorrente") === -1,
        "etapa ativa NÃO pode oferecer motivo de perda (campo sem sentido vira dado sujo)");
      ok(bAtiva.indexOf("pResponsavel") >= 0 && bAtiva.indexOf("pDataProxima") >= 0,
        "os campos de operação existem em qualquer etapa");

      // ---- (5) ativa x final ----
      ok(ETAPAS_FINAIS.join() === "Ganho,Perdido",
        "as etapas FINAIS são exatamente Ganho e Perdido");
      ok(ehAtiva({ Etapa_Pipeline: "Qualificado" }) === true && ehAtiva({ Etapa_Pipeline: "Lead Novo" }) === true,
        "proposta em etapa de trabalho é ATIVA (e por isso é cobrada por próxima ação)");
      ok(ehAtiva({ Etapa_Pipeline: "Ganho" }) === false && ehAtiva({ Etapa_Pipeline: "Perdido" }) === false,
        "proposta em desfecho NÃO é cobrada por próxima ação");
      ok(ehAtiva({}) === true,
        "proposta SEM etapa conta como ativa (na dúvida, cobra-se — some do funil é pior)");

      // ---- chaves de dia (comparação de urgência) ----
      ok(dataChave("2026-08-04T00:00:00Z") === "2026-08-04" && dataChave("2026-08-04T12:00:00Z") === "2026-08-04",
        "dataChave: DateOnly e data ao meio-dia caem no MESMO dia");
      ok(dataChave("") === "" && dataChave(null) === "" && dataChave("lixo") === "",
        "dataChave: sem data devolve '' (e '' nunca é menor que hoje por acidente na comparação)");
      ok(/^\d{4}-\d{2}-\d{2}$/.test(hojeChave()) && dataChave("1999-01-01T12:00:00Z") < hojeChave(),
        "hojeChave: formato comparável por string, com o passado ficando menor que hoje");

      ok(shaCurto("0123456789abcdef0123").indexOf("…") > 0 && !shaCurto("") && !shaCurto(null),
        "shaCurto: hash ausente não pode virar um '…' solto na tela (vazio é vazio)");

      // ---- Registrar Venda Ganha (item 12/CRM-3, despacho 21/08) ----
      // comando ainda não existe no backend: nada aqui pode fingir gravação real.
      ok(sugerirTipoEntrega("Fornecimento de Materiais").tipo === "VENDA_MATERIAL",
        "sugerirTipoEntrega: fornecimento de materiais sugere VENDA_MATERIAL");
      ok(sugerirTipoEntrega("Laudo Técnico").tipo === "PROJETO" && sugerirTipoEntrega("Projeto Elétrico").tipo === "PROJETO",
        "sugerirTipoEntrega: laudo/projeto sugerem PROJETO");
      ok(sugerirTipoEntrega("SPDA").tipo === "OS_SIMPLES" && sugerirTipoEntrega("NR-10").tipo === "OS_SIMPLES",
        "sugerirTipoEntrega: execução em campo (SPDA, NR-10, etc.) sugere OS_SIMPLES");
      ok(sugerirTipoEntrega(null).tipo === "OS_SIMPLES" && sugerirTipoEntrega("").tipo === "OS_SIMPLES",
        "sugerirTipoEntrega: sem tipo de serviço, default de segurança é OS_SIMPLES (nunca trava vazio)");

      const avFake = (hashVigente, versoes) => ({ hashVigente: hashVigente, versoes: versoes || [] });
      ok(valorOfertaCongelada(avFake(null, [])) === null,
        "valorOfertaCongelada: sem oferta congelada vigente, não há valor de referência (null, não 0)");
      ok(valorOfertaCongelada(avFake("h1", [{ fields: { Hash_SHA256: "h1", Valor_Total_Congelado: 45890 } }])) === 45890,
        "valorOfertaCongelada: acha a linha do ledger que bate com o hash vigente e devolve o valor congelado");
      ok(valorOfertaCongelada(avFake("h9", [{ fields: { Hash_SHA256: "h1", Valor_Total_Congelado: 45890 } }])) === null,
        "valorOfertaCongelada: ponteiro fora do ledger (hash vigente não bate com nenhuma linha) devolve null, não adivinha");

      ok(valorDivergente(1500.5, 1500.50) === false,
        "valorDivergente: 1500.5 e 1500.50 são o MESMO valor — comparação em centavos, sem ruído de ponto flutuante");
      ok(valorDivergente(1500.51, 1500.50) === true,
        "valorDivergente: 1 centavo de diferença já conta como divergência");
      ok(valorDivergente(99999, null) === false,
        "valorDivergente: sem valor congelado (proposta sem oferta) não há o que divergir — nunca falso positivo");

      const dVG = (over) => Object.assign({ valor: 45890, escopo: "x", condicoes: "y", responsavel: "z", tipoEntrega: "OS_SIMPLES", valorCongelado: 45890 }, over || {});
      ok(validarVendaGanha(dVG()).ok === true,
        "validarVendaGanha: os 5 campos preenchidos e sem divergência passam");
      ok(validarVendaGanha({}).ok === false && validarVendaGanha({}).faltando.length === 5,
        "validarVendaGanha: formulário vazio reporta os 5 campos obrigatórios (nenhum omitido)");
      ok(validarVendaGanha(dVG({ valor: 0 })).ok === false,
        "validarVendaGanha: valor final tem de ser MAIOR que zero — venda ganha de graça é dado sujo");
      ok(validarVendaGanha(dVG({ tipoEntrega: "" })).faltando.indexOf("Tipo de entrega (confirme ou escolha)") > -1,
        "validarVendaGanha: Tipo_Entrega vazio (nenhum radio marcado) É REPROVADO — nunca herança silenciosa da sugestão");
      ok(validarVendaGanha(dVG({ tipoEntrega: "algo-inventado" })).ok === false,
        "validarVendaGanha: Tipo_Entrega fora dos 3 valores reais é reprovado");
      ok(validarVendaGanha(dVG({ valor: 40000 })).faltando.indexOf("Justificativa da divergência de valor") > -1,
        "validarVendaGanha: valor divergente do congelado SEM justificativa é reprovado");
      ok(validarVendaGanha(dVG({ valor: 40000, justificativaDivergencia: "desconto aprovado" })).ok === true,
        "validarVendaGanha: valor divergente COM justificativa passa");

      const payloadVG = montarPayloadVendaGanha(
        { id: "abc123", fields: { Title: "PROP-1", ClienteLookupId: 42 }, _avaliar: { versaoVigente: 3, hashVigente: "deadbeef" } },
        { clienteNome: "Cliente X", valor: "1500.5", escopo: " Instalação SPDA ", condicoes: " 30 dias ", responsavel: " Fulano ",
          tipoEntrega: "OS_SIMPLES", tipoEntregaAutoSugerido: true, valorCongelado: 1500.5, agora: "2026-08-21T12:00:00.000Z" },
        "fulano@eletrium.com.br"
      );
      ok(payloadVG.comando === "RegistrarVendaGanha" && payloadVG.proposta_id === "abc123",
        "montarPayloadVendaGanha: identifica o comando e a proposta");
      ok(payloadVG.oferta_versao === 3 && payloadVG.oferta_hash === "deadbeef",
        "montarPayloadVendaGanha: carrega versão/hash vigente da oferta (congelamento de dados travado pelo CRM-2)");
      ok(payloadVG.valor_final === 1500.5 && typeof payloadVG.valor_final === "number",
        "montarPayloadVendaGanha: valor final vira number, não string do input");
      ok(payloadVG.escopo_final === "Instalação SPDA" && payloadVG.condicoes_finais === "30 dias" && payloadVG.responsavel === "Fulano",
        "montarPayloadVendaGanha: texto do formulário grava com trim");
      ok(payloadVG.divergencia_valor === false && payloadVG.justificativa_divergencia_valor === null,
        "montarPayloadVendaGanha: sem divergência, justificativa vai null (não string vazia)");
      const payloadDivergente = montarPayloadVendaGanha(
        { id: "abc123", fields: {}, _avaliar: {} },
        { valor: "40000", escopo: "x", condicoes: "y", responsavel: "z", tipoEntrega: "OS_SIMPLES",
          valorCongelado: 45890, justificativaDivergencia: " desconto aprovado ", agora: "2026-08-21T12:00:00.000Z" },
        "fulano@eletrium.com.br"
      );
      ok(payloadDivergente.divergencia_valor === true && payloadDivergente.justificativa_divergencia_valor === "desconto aprovado",
        "montarPayloadVendaGanha: divergência marcada e justificativa gravada com trim");

      const bVGFechada = blocoVendaGanha({ fields: { Etapa_Pipeline: "Ganho" } });
      const bVGPerdida = blocoVendaGanha({ fields: { Etapa_Pipeline: "Perdido" } });
      ok(bVGFechada === "" && bVGPerdida === "",
        "blocoVendaGanha: não aparece em proposta já fechada (Ganho/Perdido) — o comando não se aplica mais");
      const bVGAtiva = blocoVendaGanha({ fields: { Etapa_Pipeline: "Qualificado" } });
      ok(bVGAtiva.indexOf('name="vgTipoEntrega"') > -1 && (bVGAtiva.match(/type="radio"/g) || []).length === 3,
        "blocoVendaGanha: proposta ativa mostra as 3 opções de Tipo_Entrega, nenhuma marcada por padrão (sem 'checked' no HTML)");
      ok(bVGAtiva.indexOf("checked") === -1,
        "blocoVendaGanha: nenhum radio nasce marcado — confirmação sempre explícita, mesmo quando bate com a sugestão");
      ok(bVGAtiva.indexOf('id="vgConfirmar" disabled') > -1,
        "blocoVendaGanha: botão de confirmar nasce desabilitado — só libera depois de validarVendaGanha passar (via ligarVendaGanha)");
      ok(bVGAtiva.indexOf("STUB") > -1,
        "blocoVendaGanha: rótulo STUB sempre visível — comando real ainda não existe no backend");

      // ---- Reabrir Proposta (§25/CRM-3, despacho 21/08 — schema/fluxo TRAVADOS) ----
      // comando ainda não existe no backend: nada aqui pode fingir gravação real.
      ok(etapaReabrivel("Ganho") === true && etapaReabrivel("Perdido") === true,
        "etapaReabrivel: só Ganho/Perdido são reabríveis (passo 3 do fluxo)");
      ok(etapaReabrivel("Qualificado") === false && etapaReabrivel("") === false && etapaReabrivel(null) === false,
        "etapaReabrivel: etapa ativa (ou vazia) nunca é reabrível — reabertura não se aplica");
      ok(exigeDetalheReabertura("Outro") === true,
        "exigeDetalheReabertura: só 'Outro' exige o detalhe do motivo");
      ok(exigeDetalheReabertura("Erro de lançamento") === false && exigeDetalheReabertura("") === false,
        "exigeDetalheReabertura: os outros 3 motivos (e vazio) não travam o campo extra");

      const dRE = (over) => Object.assign({ etapaDestino: "Em Negociação", categoria: "Erro de lançamento", exigeConfirmacaoVinculo: false }, over || {});
      ok(validarReabrirProposta(dRE()).ok === true,
        "validarReabrirProposta: etapa de destino válida + motivo válido, sem vínculo pendente, passa");
      ok(validarReabrirProposta({}).faltando.length === 2,
        "validarReabrirProposta: formulário vazio reporta os 2 obrigatórios base (etapa destino + motivo)");
      ok(validarReabrirProposta(dRE({ etapaDestino: "Lead Novo" })).ok === false,
        "validarReabrirProposta: etapa de destino FORA das 2 permitidas é reprovada — nunca a etapa inicial (passo 4)");
      ok(validarReabrirProposta(dRE({ categoria: "Outro" })).faltando.indexOf("Detalhe do motivo (obrigatório para \"Outro\")") > -1,
        "validarReabrirProposta: categoria 'Outro' sem detalhe é reprovada");
      ok(validarReabrirProposta(dRE({ categoria: "Outro", detalhe: "cliente pediu revisão" })).ok === true,
        "validarReabrirProposta: categoria 'Outro' COM detalhe passa");
      ok(validarReabrirProposta(dRE({ exigeConfirmacaoVinculo: true })).faltando.indexOf("Confirmação de vínculo com Projeto/OS") > -1,
        "validarReabrirProposta: exige confirmação de vínculo quando marcado e ela não veio (passo 6)");
      ok(validarReabrirProposta(dRE({ exigeConfirmacaoVinculo: true, confirmacaoVinculo: true })).ok === true,
        "validarReabrirProposta: confirmação de vínculo marcada libera");

      const payloadRE = montarPayloadReabrirProposta(
        { id: "77" },
        { etapaDestino: "Aguardando Decisão", categoria: "Outro", detalhe: " revisão de escopo ", exigeConfirmacaoVinculo: false },
        "idem-key-teste"
      );
      ok(payloadRE.Proposta_ID === "77" && payloadRE.Idempotency_Key === "idem-key-teste" && payloadRE.Etapa_Destino === "Aguardando Decisão",
        "montarPayloadReabrirProposta: identifica proposta/tentativa/destino com os nomes EXATOS da §25.2");
      ok(payloadRE.Motivo_Reabertura_Detalhe === "revisão de escopo",
        "montarPayloadReabrirProposta: detalhe do motivo grava com trim quando a categoria exige");
      ok(!("Confirmacao_Projeto_Vinculado" in payloadRE),
        "montarPayloadReabrirProposta: SEM Confirmacao_Projeto_Vinculado quando não é exigida — campo condicional de verdade");
      ok(!("Responsavel" in payloadRE),
        "montarPayloadReabrirProposta: Responsavel NUNCA entra no payload — vem do usuário autenticado no backend, não é input (§25.2)");
      const payloadREVinculo = montarPayloadReabrirProposta(
        { id: "77" }, { etapaDestino: "Em Negociação", categoria: "Erro de lançamento", exigeConfirmacaoVinculo: true, confirmacaoVinculo: true }, "idem-key-2"
      );
      ok(payloadREVinculo.Confirmacao_Projeto_Vinculado === true,
        "montarPayloadReabrirProposta: Confirmacao_Projeto_Vinculado entra quando a 2ª fase do fluxo exigiu");

      const k1RE = gerarIdempotencyKeyReabertura(), k2RE = gerarIdempotencyKeyReabertura();
      ok(typeof k1RE === "string" && k1RE.length >= 16 && k1RE !== k2RE,
        "gerarIdempotencyKeyReabertura: chave não-trivial e nunca colide entre duas aberturas de diálogo");

      const bREFechada1 = blocoReabrirProposta({ fields: { Etapa_Pipeline: "Ganho" } });
      const bREFechada2 = blocoReabrirProposta({ fields: { Etapa_Pipeline: "Perdido" } });
      const bREAtiva = blocoReabrirProposta({ fields: { Etapa_Pipeline: "Qualificado" } });
      ok(bREFechada1 !== "" && bREFechada2 !== "",
        "blocoReabrirProposta: aparece em proposta Ganho OU Perdido — as únicas etapas reabríveis");
      ok(bREAtiva === "",
        "blocoReabrirProposta: NÃO aparece em proposta ativa — reabertura só faz sentido pra proposta fechada");
      ok((bREFechada1.match(/name="reEtapaDestino"/g) || []).length === 2 && bREFechada1.indexOf("checked") === -1,
        "blocoReabrirProposta: as 2 etapas de destino aparecem, nenhuma pré-marcada — escolha sempre explícita");
      ok(bREFechada1.indexOf('id="reConfirmar" disabled') > -1,
        "blocoReabrirProposta: botão de confirmar nasce desabilitado — só libera depois de validarReabrirProposta passar");
      ok(bREFechada1.indexOf("STUB") > -1,
        "blocoReabrirProposta: rótulo STUB sempre visível — comando real (§25) ainda não existe no backend");

      const r = { ok: falhas.length === 0, total, falhas };
      console.log("PROP.assertRegras:", JSON.stringify(r, null, 2));
      return r;
    };

    boot().catch(e => setStatus("Erro MSAL: " + e.message, "err"));
  </script>
