name: CRM Observabilidade Tests
on:
  pull_request:
    branches: [active-crm-v1.2-20260821]
  push:
    branches: ['crm-e-*']
jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test staleness rules
        run: node tests/crm/test-crm-observabilidade.js
