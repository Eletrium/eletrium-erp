name: CRM Inbound Tests
on:
  pull_request:
    branches: [active-crm-v1.2-20260821]
  push:
    branches: ['crm-a-*']
jobs:
  inbound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test CRM audit core
        run: node tests/crm/test-crm-auditoria.js
      - name: Test inbound local intent journal
        run: node tests/crm/test-inbound-resiliencia.js
