<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eletrium ERP — Kanban de Propostas</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js"></script>
  <script src="pipeline.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; background: #0d1117; color: #e6edf3; }
    header { padding: 14px 20px; border-bottom: 1px solid #30363d; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 1rem; margin: 0; }
    nav { display: flex; gap: 4px; flex: 1; }
    nav a { color: #8b949e; text-decoration: none; font-size: .9rem; padding: 5px 12px; border-radius: 6px; }
    nav a:hover { color: #e6edf3; background: #ffffff0d; }
    nav a.active { color: #e6edf3; background: #1f6feb22; }
    header .user { font-size: .82rem; color: #8b949e; }
    button { font-size: .92rem; padding: 7px 14px; border-radius: 6px; border: 1px solid #0078D4; background: #0078D4; color: #fff; cursor: pointer; }
    button.sec { background: transparent; color: #58a6ff; border-color: #30363d; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { font-size: .85rem; color: #8b949e; padding: 8px 20px; }
    .warn { margin: 8px 20px; padding: 10px 14px; border-radius: 8px; border: 1px solid #d2992255; background: #d2992218; color: #e3b341; font-size: .85rem; }
    .warn.hidden { display: none; }
    .warn code { background: #ffffff14; padding: 1px 5px; border-radius: 4px; }

    /* --- Kanban --- */
    .board { display: flex; gap: 12px; overflow-x: auto; padding: 12px 20px 28px; align-items: flex-start; }
    .col { flex: 0 0 262px; max-width: 262px; background: #010409; border: 1px solid #30363d; border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 190px); }
    .col.drop { border-color: #58a6ff; box-shadow: 0 0 0 1px #58a6ff inset; }
    .col-head { padding: 12px 14px 10px; border-top: 3px solid #6e7681; border-radius: 10px 10px 0 0; }
    .col-title { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
    .col-count { background: #ffffff14; border-radius: 999px; padding: 0 8px; font-size: .75rem; color: #8b949e; }
    .col-sum { color: #3fb950; font-size: .8rem; margin-top: 3px; }
    .col-body { padding: 0 10px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; cursor: grab; }
    .card:hover { border-color: #58a6ff; }
    .card.dragging { opacity: .5; }
    .card .num { font-weight: 600; font-size: .92rem; }
    .card .cli { color: #8b949e; font-size: .82rem; margin: 3px 0; }
    .card .val { color: #3fb950; font-weight: 600; font-size: .85rem; margin-top: 5px; }
    .empty { color: #484f58; font-size: .8rem; text-align: center; padding: 14px 0; }
    pre { background: #010409; border: 1px solid #30363d; border-radius: 8px; padding: 12px; overflow: auto; max-height: 320px; font-size: .78rem; margin: 0 20px 24px; }
    .err { color: #f85149; }

    /* --- Drawer de detalhe --- */
    .overlay { position: fixed; inset: 0; background: #000a; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 92vw; background: #0d1117; border-left: 1px solid #30363d; transform: translateX(100%); transition: transform .18s ease; z-index: 11; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 16px 18px; border-bottom: 1px solid #30363d; display: flex; align-items: flex-start; gap: 10px; }
    .drawer-head .t { flex: 1; }
    .drawer-head .num { font-size: 1.1rem; font-weight: 600; }
    .drawer-head .etapa { display: inline-block; margin-top: 6px; border-radius: 6px; padding: 2px 9px; font-size: .78rem; color: #0d1117; font-weight: 600; }
    .drawer-head .x { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 4px 10px; }
    .drawer-body { padding: 6px 18px 24px; overflow-y: auto; }
    .drawer-body dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 14px 0; }
    .drawer-body dt { color: #8b949e; font-size: .82rem; }
    .drawer-body dd { margin: 0; font-size: .88rem; word-break: break-word; }
    .drawer-body .raw-toggle { font-size: .8rem; color: #58a6ff; cursor: pointer; margin-top: 10px; display: inline-block; }
  </style>
</head>
<body>
  <header>
    <h1>Eletrium ERP</h1>
    <nav>
      <a href="index.html" class="active">Kanban</a>
      <a href="propostas.html">Propostas</a>
      <a href="clientes.html">Clientes</a>
    </nav>
    <span class="user" id="user"></span>
    <button id="btnLogin">Entrar</button>
    <button id="btnLoad" class="sec" disabled>Carregar</button>
    <button id="btnJson" class="sec" disabled>JSON</button>
    <button id="btnLogout" class="sec" disabled>Sair</button>
  </header>
  <div id="status">Não autenticado.</div>
  <div id="etapaWarn" class="warn hidden"></div>
  <div class="board" id="board"></div>
  <pre id="json" hidden></pre>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <script>
    // ===================== CONFIG =====================
    const CONFIG = {
      clientId: "f0c63078-fe75-4f7a-8f87-8783c12e7df8", // Eletrium ERP - Web App (delegado, SPA)
      tenantId: "6b76ebcc-abef-462d-a0be-eebf5a9e434b",
      siteHost: "gwtecheletrica.sharepoint.com",
      sitePath: "/sites/EletriumERP",
      scopes: ["User.Read", "Sites.ReadWrite.All"] // ReadWrite: necessário p/ arrastar-e-salvar (PATCH)
    };
    const GRAPH = "https://graph.microsoft.com/v1.0";
    const BRL = (n) => (n ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const fmtDate = (s) => { if (!s) return null; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString("pt-BR"); };
    // ==================================================

    const $ = (id) => document.getElementById(id);
    const setStatus = (m, cls) => { $("status").textContent = m; $("status").className = cls || ""; };
    let account = null, msalApp = null, lastPayload = null, siteId = null;
    window.currentUser = null;
    let propMap = {}, nomeClienteMap = {};

    async function init() {
      msalApp = new msal.PublicClientApplication({
        auth: { clientId: CONFIG.clientId, authority: "https://login.microsoftonline.com/" + CONFIG.tenantId, redirectUri: window.location.origin },
        cache: { cacheLocation: "sessionStorage" }
      });
      await msalApp.initialize();
      const a = msalApp.getAllAccounts();
      if (a.length) { account = a[0]; await onIn(); }
    }

    async function onIn() {
      setStatus("Autenticado como " + account.username);
      $("btnLogin").disabled = true; $("btnLoad").disabled = false; $("btnJson").disabled = false; $("btnLogout").disabled = false;
      try {
        const me = await gget("/me?$select=id,displayName,userPrincipalName,mail", await token());
        window.currentUser = { id: me.id, nome: me.displayName, email: me.mail || me.userPrincipalName };
        $("user").textContent = "👤 " + window.currentUser.nome;
      } catch (e) { $("user").textContent = "👤 " + account.username + " (falha no /me)"; }
    }

    async function token() {
      const req = { scopes: CONFIG.scopes, account };
      try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
      catch { return (await msalApp.acquireTokenPopup(req)).accessToken; }
    }
    const gget = async (url, t) => (await fetch(url.startsWith("http") ? url : GRAPH + url, { headers: { Authorization: "Bearer " + t, Accept: "application/json" } })).json();

    $("btnLogin").onclick = async () => {
      try { const r = await msalApp.loginPopup({ scopes: CONFIG.scopes }); account = r.account; msalApp.setActiveAccount(account); await onIn(); }
      catch (e) { setStatus("Falha no login: " + e.message, "err"); }
    };
    $("btnLogout").onclick = async () => {
      await msalApp.logoutPopup({ account }); account = null; window.currentUser = null;
      setStatus("Não autenticado."); $("user").textContent = ""; $("btnLogin").disabled = false;
      ["btnLoad","btnJson","btnLogout"].forEach(id => $(id).disabled = true);
      $("board").innerHTML = ""; $("etapaWarn").className = "warn hidden"; closeDrawer();
    };

    $("btnLoad").onclick = async () => {
      try {
        setStatus("Carregando via Graph...");
        const t = await token();
        const site = await gget("/sites/" + CONFIG.siteHost + ":" + CONFIG.sitePath, t);
        if (!site.id) throw new Error("não resolveu o site");
        siteId = site.id;
        const cols = await gget("/sites/" + siteId + "/lists/Propostas/columns", t);
        const etapa = (cols.value || []).find(c => c.name === "Etapa_Pipeline");
        const choices = etapa && etapa.choice ? etapa.choice.choices : [];

        renderEtapaWarn(window.validateEtapasConfig(choices));

        const props = await gget("/sites/" + siteId + "/lists/Propostas/items?expand=fields&$top=500", t);
        const clientes = await gget("/sites/" + siteId + "/lists/Clientes/items?expand=fields($select=Title)&$top=500", t);
        nomeClienteMap = {};
        (clientes.value || []).forEach(c => { nomeClienteMap[c.id] = c.fields.Title; });
        propMap = {};
        (props.value || []).forEach(p => { propMap[p.id] = p; });

        lastPayload = { site: site.displayName, choices, propostas: props.value, clientesMap: nomeClienteMap };
        renderBoard(choices, props.value);
        setStatus("OK — " + (props.value || []).length + " proposta(s). Arraste cards entre colunas para mover.");
      } catch (e) { setStatus("Falha: " + e.message, "err"); }
    };

    $("btnJson").onclick = () => { const p = $("json"); p.hidden = !p.hidden; p.textContent = JSON.stringify(lastPayload, null, 2); };

    function renderEtapaWarn(v) {
      const el = $("etapaWarn");
      if (v.ok) { el.className = "warn hidden"; el.innerHTML = ""; return; }
      let html = "<strong>⚠️ Divergência entre ETAPA_CONFIG e os choices do SharePoint:</strong><br>";
      if (v.semChoice.length) html += "No código mas <em>não</em> existem como etapa (typo/acento?): " + v.semChoice.map(x => "<code>" + x + "</code>").join(" ") + "<br>";
      if (v.semConfig.length) html += "Etapa do SharePoint <em>sem</em> cor no ETAPA_CONFIG (usará fallback): " + v.semConfig.map(x => "<code>" + x + "</code>").join(" ");
      el.innerHTML = html; el.className = "warn";
    }

    const cliNome = (f) => nomeClienteMap[f.ClienteLookupId] || ("cliente #" + (f.ClienteLookupId ?? "?"));

    function cardHtml(p) {
      const f = p.fields || {};
      return `<div class="card" draggable="true" data-id="${p.id}">
        <div class="num">${f.Title ?? "(sem número)"}</div>
        <div class="cli">${cliNome(f)}</div>
        <div class="val">${BRL(f.ValorTotal)}</div>
      </div>`;
    }

    function renderBoard(choices, propostas) {
      const byEtapa = {}; choices.forEach(c => byEtapa[c] = []);
      const semEtapa = [];
      (propostas || []).forEach(p => {
        const e = p.fields && p.fields.Etapa_Pipeline;
        if (e && byEtapa[e]) byEtapa[e].push(p); else semEtapa.push(p);
      });
      const colunas = choices.map(c => ({ nome: c, etapa: c, cor: window.etapaCor(c), items: byEtapa[c] }));
      if (semEtapa.length) colunas.push({ nome: "(sem etapa)", etapa: "", cor: window.ETAPA_COR_FALLBACK, items: semEtapa });

      $("board").innerHTML = colunas.map(col => {
        const sum = col.items.reduce((s, p) => s + ((p.fields && p.fields.ValorTotal) || 0), 0);
        const body = col.items.map(cardHtml).join("") || "<div class='empty'>—</div>";
        return `<div class="col" data-etapa="${col.etapa}">
          <div class="col-head" style="border-top-color:${col.cor}">
            <div class="col-title" style="color:${col.cor}">${col.nome} <span class="col-count">${col.items.length}</span></div>
            <div class="col-sum">${BRL(sum)}</div>
          </div>
          <div class="col-body">${body}</div>
        </div>`;
      }).join("");
    }

    // --- Drag & drop: mover proposta de etapa (PATCH no Graph) ---
    const board = $("board");
    board.addEventListener("dragstart", (e) => { const c = e.target.closest(".card"); if (c) { e.dataTransfer.setData("text/plain", c.dataset.id); c.classList.add("dragging"); } });
    board.addEventListener("dragend", (e) => { const c = e.target.closest(".card"); if (c) c.classList.remove("dragging"); });
    board.addEventListener("dragover", (e) => { const col = e.target.closest(".col"); if (col && col.dataset.etapa) { e.preventDefault(); col.classList.add("drop"); } });
    board.addEventListener("dragleave", (e) => { const col = e.target.closest(".col"); if (col) col.classList.remove("drop"); });
    board.addEventListener("drop", (e) => {
      const col = e.target.closest(".col"); if (!col || !col.dataset.etapa) return;
      e.preventDefault(); col.classList.remove("drop");
      moveProposta(e.dataTransfer.getData("text/plain"), col.dataset.etapa);
    });

    async function moveProposta(id, novaEtapa) {
      const p = propMap[id]; if (!p) return;
      const atual = p.fields.Etapa_Pipeline;
      if (!novaEtapa || novaEtapa === atual) return;
      setStatus("Movendo " + (p.fields.Title || id) + " → " + novaEtapa + "...");
      try {
        const t = await token();
        const url = GRAPH + "/sites/" + siteId + "/lists/Propostas/items/" + id + "/fields";
        const body = { Etapa_Pipeline: novaEtapa, Data_Entrada_Etapa: new Date().toISOString() };
        const res = await fetch(url, { method: "PATCH", headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (!res.ok) throw new Error(res.status + " " + (await res.text()));
        // sucesso: atualiza estado local e re-renderiza (sem refetch)
        p.fields.Etapa_Pipeline = novaEtapa;
        p.fields.Data_Entrada_Etapa = body.Data_Entrada_Etapa;
        renderBoard(lastPayload.choices, lastPayload.propostas);
        setStatus("✔ " + (p.fields.Title || id) + " movida para " + novaEtapa + ".");
      } catch (e) { setStatus("Falha ao mover (nada foi alterado): " + e.message, "err"); }
    }

    // --- Detalhe (drawer) ---
    board.addEventListener("click", (ev) => {
      const card = ev.target.closest(".card"); if (!card) return;
      const p = propMap[card.dataset.id]; if (p) openDrawer(p);
    });
    $("overlay").onclick = closeDrawer;
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

    function row(label, value) { return value == null || value === "" ? "" : `<dt>${label}</dt><dd>${value}</dd>`; }

    function openDrawer(p) {
      const f = p.fields || {};
      const cor = window.etapaCor(f.Etapa_Pipeline);
      const campos = [
        row("Cliente", cliNome(f)),
        row("Status", f.Status),
        row("Valor total", f.ValorTotal != null ? BRL(f.ValorTotal) : null),
        row("Valor serviços", f.Valor_Servico != null ? BRL(f.Valor_Servico) : null),
        row("Valor materiais", f.Valor_Materiais != null ? BRL(f.Valor_Materiais) : null),
        row("Margem prevista", f.Margem_Prevista_Pct != null ? f.Margem_Prevista_Pct + "%" : null),
        row("Descrição", f.Descricao),
        row("Emissão", fmtDate(f.DataEmissao)),
        row("Validade", fmtDate(f.DataValidade)),
        row("Entrada na etapa", fmtDate(f.Data_Entrada_Etapa)),
        row("Forma pgto", f.FormaPagamento),
        row("Prazo execução", f.PrazoExecucao),
        row("Probabilidade", f.Probabilidade_Fechamento != null ? f.Probabilidade_Fechamento + "%" : null),
        row("Responsável", f.Responsavel_Principal),
        row("Origem do lead", f.Origem_Lead),
        row("Observações", f.Observacoes)
      ].join("");
      $("drawer").innerHTML = `
        <div class="drawer-head">
          <div class="t">
            <div class="num">${f.Title ?? "(sem número)"}</div>
            <span class="etapa" style="background:${cor}">${f.Etapa_Pipeline ?? "(sem etapa)"}</span>
          </div>
          <button class="x" id="drawerClose">Fechar ✕</button>
        </div>
        <div class="drawer-body">
          <dl>${campos}</dl>
          <span class="raw-toggle" id="rawToggle">ver campos crus (Graph)</span>
          <pre id="rawFields" hidden style="margin:8px 0 0">${JSON.stringify(f, null, 2)}</pre>
        </div>`;
      $("drawerClose").onclick = closeDrawer;
      $("rawToggle").onclick = () => { const r = $("rawFields"); r.hidden = !r.hidden; };
      $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
      $("overlay").classList.add("open");
    }
    function closeDrawer() {
      $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true");
      $("overlay").classList.remove("open");
    }

    init().catch(e => setStatus("Erro MSAL: " + e.message, "err"));
  </script>
</body>
</html>
