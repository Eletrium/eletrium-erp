<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eletrium ERP — Kanban de Propostas</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js"></script>
  <script src="graph.js"></script>
  <script src="pipeline.js"></script>
  <!-- app.css entra ANTES do <style> local: as regras locais continuam vencendo
       (mesma especificidade, origem posterior), mas a PALETA (--acao, …) passa a
       vir de um lugar só. Antes esta tela duplicava o app.css inteiro inline e
       era a única das 19 que não o carregava — por isso as variáveis de cor não
       resolviam aqui. -->
  <link rel="stylesheet" href="app.css" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; background: #0d1117; color: #e6edf3; }
    header { padding: 14px 20px; border-bottom: 1px solid #30363d; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 1rem; margin: 0; }
    nav { display: flex; gap: 4px; flex: 1; }
    nav a { color: #8b949e; text-decoration: none; font-size: .9rem; padding: 5px 12px; border-radius: 6px; }
    nav a:hover { color: #e6edf3; background: #ffffff0d; }
    nav a.active { color: #e6edf3; background: var(--acao-tenue); box-shadow: inset 0 -2px 0 var(--acao-clara); }
    header .user { font-size: .82rem; color: #8b949e; }
    button { font-size: .92rem; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--acao); background: var(--acao); color: #fff; cursor: pointer; }
    button.sec { background: transparent; color: var(--acao-clara); border-color: #30363d; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { font-size: .85rem; color: #8b949e; padding: 8px 20px; }
    .warn { margin: 8px 20px; padding: 10px 14px; border-radius: 8px; border: 1px solid #d2992255; background: #d2992218; color: #e3b341; font-size: .85rem; }
    .warn.hidden { display: none; }
    .warn code { background: #ffffff14; padding: 1px 5px; border-radius: 4px; }

    /* --- Estados de tela (EG.renderEstado) --- */
    .estado { margin: 8px 20px; font-size: .9rem; color: #8b949e; }
    /* estados de tela: regras .eg-estado-* agora vivem SO no app.css */

    /* --- Kanban --- */
    .board { display: flex; gap: 12px; overflow-x: auto; padding: 12px 20px 28px; align-items: flex-start; }
    /* largura ÚNICA vinda do app.css (--kanban-col): igual entre as colunas E
       igual à do Kanban de faturamento.html */
    .col { flex: 0 0 var(--kanban-col); max-width: var(--kanban-col); background: #010409; border: 1px solid #30363d; border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 190px); }
    .col.drop { border-color: var(--acao-clara); box-shadow: 0 0 0 2px var(--acao-clara) inset; }
    /* cabeçalho FIXO: gruda no topo enquanto a coluna rola. Precisa de fundo
       opaco próprio, senão os cards passam por baixo. */
    .col-head { padding: 12px 14px 10px; border-top: 3px solid #6e7681; border-radius: 10px 10px 0 0; position: sticky; top: 0; z-index: 3; background: #010409; box-shadow: 0 1px 0 #30363d; }
    .col-title { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
    .col-nome { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .col-count { background: #ffffff14; border-radius: 999px; padding: 0 8px; font-size: .75rem; color: #8b949e; flex: 0 0 auto; }
    /* total da coluna: rótulo em texto + valor. Deixou de ser verde — verde
       agora é a cor de AÇÃO; dinheiro verde ao lado de botão verde não
       comunica mais nada. */
    .col-sum { color: #e6edf3; font-size: .8rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .col-sum .rot { color: #8b949e; font-weight: 400; }
    .col-body { padding: 0 10px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; cursor: grab; }
    .card:hover { border-color: var(--acao-clara); }
    .card.dragging { opacity: .5; }
    .card .num { font-weight: 600; font-size: .92rem; }
    .card .cli { color: #8b949e; font-size: .82rem; margin: 3px 0; }
    .card .val { color: #e6edf3; font-weight: 600; font-size: .85rem; margin-top: 5px; font-variant-numeric: tabular-nums; }
    /* operação (F5) nos cards */
    .card .meta { font-size: .78rem; margin-top: 5px; color: #8b949e; word-break: break-word; }
    /* prazo da próxima ação: a urgência era comunicada SÓ por cor (vermelho x
       laranja x cinza). Agora cada faixa tem glifo + palavra própria. */
    .card .meta.prox.vencida { color: #f85149; font-weight: 600; }
    .card .meta.prox.hoje { color: #f0883e; font-weight: 600; }
    .card .meta.motivo { color: #f85149; }
    .card .selo-sem-acao { display: inline-block; margin-top: 6px; font-size: .72rem; color: #e3b341; border: 1px solid #d2992255; background: #d2992218; border-radius: 999px; padding: 1px 8px; }
    /* gravação otimista do drag & drop */
    .card.salvando { opacity: .55; border-style: dashed; border-color: var(--acao-clara); pointer-events: none; }
    .card.rollback-erro { border-color: #f85149; animation: pulsoErro 1.5s ease; }
    @keyframes pulsoErro { 0% { box-shadow: 0 0 0 3px #f8514966; } 100% { box-shadow: 0 0 0 0 #f8514900; } }
    .empty { color: #484f58; font-size: .8rem; text-align: center; padding: 14px 0; }
    pre { background: #010409; border: 1px solid #30363d; border-radius: 8px; padding: 12px; overflow: auto; max-height: 320px; font-size: .78rem; margin: 0 20px 24px; }
    .err { color: #f85149; }

    /* --- Drawer de detalhe --- */
    .overlay { position: fixed; inset: 0; background: #000a; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 92vw; background: #0d1117; border-left: 1px solid #30363d; transform: translateX(100%); transition: transform .18s ease; z-index: 11; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 16px 18px; border-bottom: 1px solid #30363d; display: flex; align-items: flex-start; gap: 10px; }
    .drawer-head .t { flex: 1; }
    .drawer-head .num { font-size: 1.1rem; font-weight: 600; }
    .drawer-head .etapa { display: inline-block; margin-top: 6px; border-radius: 6px; padding: 2px 9px; font-size: .78rem; color: #0d1117; font-weight: 600; }
    .drawer-head .x { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 4px 10px; }
    .drawer-body { padding: 6px 18px 24px; overflow-y: auto; }
    .drawer-body dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 14px 0; }
    .drawer-body dt { color: #8b949e; font-size: .82rem; }
    .drawer-body dd { margin: 0; font-size: .88rem; word-break: break-word; }
    /* bloco editável de operação (F5) no drawer */
    .op-block { margin-top: 4px; border: 1px solid #30363d; border-radius: 8px; padding: 12px; background: #010409; }
    .op-block .op-title { font-weight: 600; font-size: .85rem; }
    .op-block label { display: block; font-size: .78rem; color: #8b949e; margin: 8px 0 3px; }
    .op-block input, .op-block select { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 6px 8px; font-size: .88rem; font-family: inherit; }
    .op-block button { margin-top: 12px; }
    .op-msg { margin-top: 8px; font-size: .8rem; color: #8b949e; }
    .op-msg.err { color: #f85149; }

    /* --- Modais (motivo da perda / + Indicação) --- */
    .modal-bg { position: fixed; inset: 0; background: #000a; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-bg[hidden] { display: none; }
    .modal { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 20px; width: 440px; max-width: 94vw; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .modal .modal-sub { margin: 0 0 10px; color: #8b949e; font-size: .84rem; }
    .modal label { display: block; font-size: .82rem; color: #8b949e; margin: 10px 0 4px; }
    .modal input, .modal select, .modal textarea { width: 100%; background: #010409; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 7px 9px; font-size: .9rem; font-family: inherit; }
    .modal textarea { resize: vertical; }
    .modal-erro { margin-top: 10px; color: #f85149; font-size: .84rem; }
    .modal-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Eletrium ERP</h1>
    <nav>
      <a href="index.html" class="active">Kanban</a>
      <a href="propostas.html">Propostas</a>
      <a href="nova-proposta.html">Nova</a>
      <a href="clientes.html">Clientes</a>
      <a href="os.html">OS</a>
      <a href="suprimentos.html">Suprimentos</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="habilitacoes.html">Habilitações</a>
      <a href="reaquecimento.html">Reaquecimento</a>
      <a href="faturamento.html">Faturamento</a>
      <a href="fechamentos.html">Fechamentos</a>
      <a href="medicao.html">Medição</a>
      <a href="ferramental.html">Ferramental</a>
      <a href="portal-alocacao.html">Alocação</a>
      <a href="checklist.html">Checklist</a>
      <a href="projetos-v2.html">Projetos</a>
      <a href="documentos-os.html">Documentos</a>
    </nav>
    <span class="user" id="user"></span>
    <button id="btnLogin">Entrar</button>
    <button id="btnLoad" class="sec" disabled>Carregar</button>
    <button id="btnIndicacao" class="sec" disabled>+ Indicação</button>
    <button id="btnLogout" class="sec" disabled>Sair</button>
  </header>
  <div id="status">Não autenticado.</div>
  <div id="etapaWarn" class="warn hidden"></div>
  <div id="estado" class="estado" hidden></div>
  <div class="board" id="board"></div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <!-- Mini-modal: motivo da perda (obrigatório ao arrastar para "Perdido") -->
  <div class="modal-bg" id="perdaBg" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="perdaTitulo">
      <h2 id="perdaTitulo">Marcar como Perdido</h2>
      <p class="modal-sub" id="perdaSub"></p>
      <label for="perdaMotivo">Motivo da perda *</label>
      <div id="perdaMotivoWrap"></div>
      <div id="perdaDescricaoWrap" hidden>
        <label for="perdaDescricao">Descrição do motivo *</label>
        <textarea id="perdaDescricao" rows="2" maxlength="1000" placeholder="motivo \"Outro\" exige descrição — obrigatório"></textarea>
      </div>
      <label for="perdaConcorrente">Concorrente (opcional)</label>
      <input id="perdaConcorrente" type="text" maxlength="255" />
      <div class="modal-erro" id="perdaErro" hidden></div>
      <div class="modal-acoes">
        <button class="sec" id="perdaCancelar" type="button">Cancelar</button>
        <button id="perdaConfirmar" type="button">Confirmar perda</button>
      </div>
    </div>
  </div>

  <!-- Modal: + Indicação (F5) — registra lead manual na fila de auditoria -->
  <div class="modal-bg" id="indBg" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="indTitulo">
      <h2 id="indTitulo">+ Indicação</h2>
      <p class="modal-sub">Entra na fila de auditoria de leads — não cria proposta.</p>
      <label for="indRazao">Razão social / Nome *</label>
      <input id="indRazao" type="text" maxlength="255" />
      <label for="indDoc">CNPJ / CPF (opcional)</label>
      <input id="indDoc" type="text" maxlength="20" />
      <label for="indContato">Contato (opcional)</label>
      <input id="indContato" type="text" maxlength="255" />
      <label for="indObs">Observação (opcional)</label>
      <textarea id="indObs" rows="3"></textarea>
      <div class="modal-erro" id="indErro" hidden></div>
      <div class="modal-acoes">
        <button class="sec" id="indCancelar" type="button">Cancelar</button>
        <button id="indConfirmar" type="button">Registrar indicação</button>
      </div>
    </div>
  </div>

  <script>
    // ===================== BASE =====================
    // Migração onda 2: auth/Graph centralizados no graph.js (EG.*). O CONFIG,
    // MSAL, token() e fetch próprios que esta tela (a mais antiga do repo)
    // carregava inline foram removidos — comportamento visível preservado.
    const $ = (id) => document.getElementById(id);
    const setStatus = (m, cls) => { $("status").textContent = m; $("status").className = cls || ""; };
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const BRL = EG.BRL;
    const fmtDate = EG.fmtDate; // central: trata date-only (meia-noite UTC) sem perder 1 dia no fuso
    // ==================================================

    let lastPayload = null;
    let propMap = {}, nomeClienteMap = {};
    let etapaChoices = [];        // choices REAIS de Propostas.Etapa_Pipeline (fonte da verdade)
    let motivoPerdaChoices = [];  // choices REAIS de Propostas.Motivo_Perda (select do modal/drawer)
    let origemLeadFila = null;    // choices REAIS de Fila_Auditoria_Leads.Origem_Lead (cache lazy)
    window.currentUser = null;    // compat: a versão antiga desta tela expunha isso

    // Etapas fechadas: fora delas o card é "ativo" e mostra a operação (F5)
    const ETAPAS_FECHADAS = ["Ganho", "Perdido"];

    // ===================== AUTENTICAÇÃO (EG.*) =====================
    async function boot() {
      const logged = await EG.init();
      if (logged) await onIn();
    }
    async function onIn() {
      setStatus("Autenticado como " + EG.getAccount().username);
      $("btnLogin").disabled = true;
      ["btnLoad", "btnIndicacao", "btnLogout"].forEach(id => $(id).disabled = false);
      try { const u = await EG.me(); window.currentUser = u; $("user").textContent = "👤 " + u.nome; }
      catch { $("user").textContent = "👤 " + EG.getAccount().username + " (falha no /me)"; }
    }
    $("btnLogin").onclick = async () => {
      try { await EG.login(); await onIn(); }
      catch (e) { setStatus("Falha no login: " + e.message, "err"); }
    };
    $("btnLogout").onclick = async () => {
      await EG.logout(); window.currentUser = null;
      setStatus("Não autenticado."); $("user").textContent = ""; $("btnLogin").disabled = false;
      ["btnLoad", "btnIndicacao", "btnLogout"].forEach(id => $(id).disabled = true);
      $("board").innerHTML = ""; $("etapaWarn").className = "warn hidden"; $("etapaWarn").innerHTML = "";
      EG.renderEstado($("estado"), "ok");
      closeDrawer(); fecharModalPerda(false); fecharModalIndicacao();
    };

    // ===================== CARGA DO QUADRO =====================
    $("btnLoad").onclick = carregar;

    async function carregar() {
      try {
        setStatus("Carregando via Graph...");
        $("board").innerHTML = "";
        EG.renderEstado($("estado"), "carregando", { mensagem: "Carregando propostas…" });

        // Choices reais de Propostas: Etapa_Pipeline (colunas do quadro) e
        // Motivo_Perda (select do modal de perda / drawer).
        const cols = await EG.listColumns("Propostas");
        const colEtapa = (cols || []).find(c => c.name === "Etapa_Pipeline");
        etapaChoices = colEtapa && colEtapa.choice ? colEtapa.choice.choices : [];
        const colMotivo = (cols || []).find(c => c.name === "Motivo_Perda");
        motivoPerdaChoices = colMotivo && colMotivo.choice && Array.isArray(colMotivo.choice.choices) ? colMotivo.choice.choices : [];

        // Trava FAIL-CLOSED: registra os choices reais de Etapa_Pipeline contra os
        // rótulos do pipeline.js; a partir daqui patchItemFields/createItem bloqueiam
        // client-side qualquer gravação com rótulo que não exista no servidor
        // (e.failClosed=true). O aviso visual continua sendo o validateEtapasConfig
        // do pipeline.js (mesma comparação), no #etapaWarn de sempre.
        await EG.travarChoices("Propostas", "Etapa_Pipeline", Object.keys(window.ETAPA_CONFIG));
        renderEtapaWarn(window.validateEtapasConfig(etapaChoices));

        // EG.listItems pagina sozinho (@odata.nextLink) — sem truncamento silencioso
        const props = await EG.listItems("Propostas", "expand=fields&$top=500");
        const clientes = await EG.listItems("Clientes", "expand=fields($select=Title)&$top=500");
        nomeClienteMap = {};
        clientes.forEach(c => { nomeClienteMap[c.id] = c.fields && c.fields.Title; });
        propMap = {};
        props.forEach(p => { propMap[p.id] = p; });

        lastPayload = { choices: etapaChoices, motivoPerdaChoices, propostas: props, clientesMap: nomeClienteMap };
        renderBoard(etapaChoices, props);
        // vazio REAL (carregou e não há itens) ≠ carregando ≠ erro
        EG.renderEstado($("estado"), props.length ? "ok" : "vazio", { mensagem: "Nenhuma proposta encontrada — o quadro está vazio." });
        setStatus("OK — " + props.length + " proposta(s). Arraste cards entre colunas para mover.");
      } catch (e) {
        EG.renderEstado($("estado"), "erro", { mensagem: e.message, onRetry: carregar });
        setStatus("Falha: " + e.message, "err");
      }
    }


    function renderEtapaWarn(v) {
      const el = $("etapaWarn");
      if (v.ok) { el.className = "warn hidden"; el.innerHTML = ""; return; }
      let html = "<strong>⚠️ Divergência entre ETAPA_CONFIG e os choices do SharePoint:</strong><br>";
      if (v.semChoice.length) html += "No código mas <em>não</em> existem como etapa (typo/acento?): " + v.semChoice.map(x => "<code>" + esc(x) + "</code>").join(" ") + "<br>";
      if (v.semConfig.length) html += "Etapa do SharePoint <em>sem</em> cor no ETAPA_CONFIG (usará fallback): " + v.semConfig.map(x => "<code>" + esc(x) + "</code>").join(" ");
      el.innerHTML = html; el.className = "warn";
    }

    // ===================== RENDER DO QUADRO =====================
    const cliNome = (f) => nomeClienteMap[f.ClienteLookupId] || ("cliente #" + (f.ClienteLookupId ?? "?"));

    // Classifica a Data_Proxima_Acao: "vencida" (vermelho) | "hoje" (laranja) | "".
    // Compara o DIA em UTC do valor gravado (12:00Z, ou 00:00Z de DateOnly — nos
    // dois casos toISOString devolve o dia certo) com o dia LOCAL de agora.
    function classeDataAcao(s) {
      if (!s) return "";
      const d = new Date(s);
      if (isNaN(d)) return "";
      const diaAcao = d.toISOString().slice(0, 10);
      const agora = new Date();
      const hojeLocal = agora.getFullYear() + "-" + String(agora.getMonth() + 1).padStart(2, "0") + "-" + String(agora.getDate()).padStart(2, "0");
      if (diaAcao < hojeLocal) return "vencida";
      if (diaAcao === hojeLocal) return "hoje";
      return "";
    }

    function cardHtml(p) {
      const f = p.fields || {};
      const etapa = f.Etapa_Pipeline;
      const ativo = !!etapa && !ETAPAS_FECHADAS.includes(etapa);
      let op = "";
      if (ativo) {
        // F5 — operação nos cards ativos: responsável + próxima ação (com prazo)
        if (f.Responsavel_Principal) op += '<div class="meta resp">👤 ' + esc(f.Responsavel_Principal) + "</div>";
        if (f.Proxima_Acao || f.Data_Proxima_Acao) {
          const cls = classeDataAcao(f.Data_Proxima_Acao);
          const data = f.Data_Proxima_Acao ? esc(fmtDate(f.Data_Proxima_Acao)) : "";
          // 2º CANAL: glifo + palavra por faixa de urgência, para não depender da cor
          const marca = cls === "vencida" ? "⚠ vencida · " : (cls === "hoje" ? "⏰ hoje · " : "➜ ");
          op += '<div class="meta prox ' + cls + '">' + marca + esc(f.Proxima_Acao || "(sem descrição)") + (data ? " · " + data : "") + "</div>";
        } else {
          // card ativo sem próxima ação combinada: selo discreto âmbar
          op += '<div class="selo-sem-acao">sem próxima ação</div>';
        }
      } else if (etapa === "Perdido" && f.Motivo_Perda) {
        op += '<div class="meta motivo">✖ ' + esc(f.Motivo_Perda) + "</div>";
      }
      return '<div class="card" draggable="true" data-id="' + esc(p.id) + '">' +
        '<div class="num">' + esc(f.Title ?? "(sem número)") + "</div>" +
        '<div class="cli">' + esc(cliNome(f)) + "</div>" +
        '<div class="val">' + BRL(f.ValorTotal) + "</div>" + op +
        "</div>";
    }

    function renderBoard(choices, propostas) {
      const byEtapa = {}; choices.forEach(c => byEtapa[c] = []);
      const semEtapa = [];
      (propostas || []).forEach(p => {
        const e = p.fields && p.fields.Etapa_Pipeline;
        if (e && byEtapa[e]) byEtapa[e].push(p); else semEtapa.push(p);
      });
      const colunas = choices.map(c => ({ nome: c, etapa: c, cor: window.etapaCor(c), items: byEtapa[c] }));
      if (semEtapa.length) colunas.push({ nome: "(sem etapa)", etapa: "", cor: window.ETAPA_COR_FALLBACK, items: semEtapa });

      $("board").innerHTML = colunas.map(col => {
        const sum = col.items.reduce((s, p) => s + ((p.fields && p.fields.ValorTotal) || 0), 0);
        const body = col.items.map(cardHtml).join("") || "<div class='empty'>—</div>";
        const n = col.items.length;
        return '<div class="col" data-etapa="' + esc(col.etapa) + '">' +
          '<div class="col-head" style="border-top-color:' + esc(col.cor) + '">' +
            '<div class="col-title" style="color:' + esc(col.cor) + '">' +
              '<span class="col-nome">' + esc(col.nome) + "</span>" +
              '<span class="col-count" title="' + n + ' proposta(s) nesta etapa">' + n + "</span>" +
            "</div>" +
            // total da coluna: contagem POR EXTENSO + soma de valor
            '<div class="col-sum"><span class="rot">' + n + (n === 1 ? " proposta · " : " propostas · ") + "</span>" + BRL(sum) + "</div>" +
          "</div>" +
          '<div class="col-body">' + body + "</div>" +
        "</div>";
      }).join("");
    }

    // ===================== DRAG & DROP (otimista + rollback) =====================
    const board = $("board");
    board.addEventListener("dragstart", (e) => { const c = e.target.closest(".card"); if (c) { e.dataTransfer.setData("text/plain", c.dataset.id); c.classList.add("dragging"); } });
    board.addEventListener("dragend", (e) => { const c = e.target.closest(".card"); if (c) c.classList.remove("dragging"); });
    board.addEventListener("dragover", (e) => { const col = e.target.closest(".col"); if (col && col.dataset.etapa) { e.preventDefault(); col.classList.add("drop"); } });
    board.addEventListener("dragleave", (e) => { const col = e.target.closest(".col"); if (col) col.classList.remove("drop"); });
    board.addEventListener("drop", (e) => {
      const col = e.target.closest(".col"); if (!col || !col.dataset.etapa) return;
      e.preventDefault(); col.classList.remove("drop");
      moveProposta(e.dataTransfer.getData("text/plain"), col.dataset.etapa);
    });

    function marcarCard(id, cls, on) {
      const el = board.querySelector('.card[data-id="' + CSS.escape(String(id)) + '"]');
      if (el) el.classList[on ? "add" : "remove"](cls);
      return el;
    }

    /* ---------- regras do movimento (funções PURAS, testáveis sem rede) ----------
       movimentoNulo: arrastar para a MESMA coluna (ou para a coluna sintética
       "(sem etapa)") não é movimento — não pode gerar PATCH nem recarimbar o
       SLA. exigeMotivoPerda: "Perdido" é a única etapa que não se alcança por
       arrasto direto; sem motivo o pipeline perde a razão da derrota.
       corpoMovimento: o corpo do PATCH — SEMPRE recarimba Data_Entrada_Etapa
       (é o relógio do SLA) e NUNCA grava "" (campo vazio é omitido). */
    const movimentoNulo = (atual, nova) => !nova || nova === atual;
    const exigeMotivoPerda = (nova) => nova === "Perdido";
    // "Outro" é o único motivo que não se explica sozinho — exige descrição própria.
    const exigeDescricaoMotivo = (motivo) => motivo === "Outro";
    function corpoMovimento(novaEtapa, camposExtras) {
      const body = { Etapa_Pipeline: novaEtapa, Data_Entrada_Etapa: new Date().toISOString() };
      if (camposExtras) Object.keys(camposExtras).forEach(k => {
        const v = camposExtras[k];
        if (v != null && v !== "") body[k] = v;
      });
      return body;
    }

    async function moveProposta(id, novaEtapa) {
      const p = propMap[id]; if (!p) return;
      const atual = p.fields.Etapa_Pipeline;
      if (movimentoNulo(atual, novaEtapa)) return;
      // arrastar para "Perdido" exige motivo: mini-modal antes da gravação
      if (exigeMotivoPerda(novaEtapa)) { abrirModalPerda(p, atual); return; }
      await gravarMovimento(p, novaEtapa, atual, null);
    }

    // Movimento OTIMISTA com rollback: o card muda de coluna imediatamente em
    // estado "salvando…" (tracejado, sem interação); se o PATCH falhar, o card
    // VOLTA à coluna de origem com realce breve de erro + mensagem normalizada.
    // O usuário nunca vê o card parado numa coluna cuja gravação falhou.
    async function gravarMovimento(p, novaEtapa, etapaAnterior, camposExtras) {
      const id = p.id;
      const dataAnterior = p.fields.Data_Entrada_Etapa;
      // 1) otimista
      p.fields.Etapa_Pipeline = novaEtapa;
      renderBoard(etapaChoices, lastPayload.propostas);
      marcarCard(id, "salvando", true);
      setStatus("Movendo " + (p.fields.Title || id) + " → " + novaEtapa + "...");
      // 2) PATCH mínimo — nunca grava "": campo vazio é omitido do corpo
      const body = corpoMovimento(novaEtapa, camposExtras);
      try {
        await EG.patchItemFields("Propostas", id, body); // trava fail-closed ativa p/ Etapa_Pipeline
        await relerProposta(id); // releitura pós-gravação: estado local = servidor
        renderBoard(etapaChoices, lastPayload.propostas);
        setStatus("✔ " + ((propMap[id].fields || {}).Title || id) + " movida para " + novaEtapa + ".");
      } catch (e) {
        // rollback visual: volta à coluna de origem + realce de erro
        p.fields.Etapa_Pipeline = etapaAnterior;
        p.fields.Data_Entrada_Etapa = dataAnterior;
        renderBoard(etapaChoices, lastPayload.propostas);
        const el = marcarCard(id, "rollback-erro", true);
        if (el) setTimeout(() => el.classList.remove("rollback-erro"), 1600);
        setStatus("Falha ao mover (nada foi alterado): " + e.message, "err");
      }
    }

    // Relê o item no servidor após gravar (padrão do repo) e atualiza os mapas locais.
    async function relerProposta(id) {
      const sid = await EG.resolveSite();
      const fresh = await EG.gget("/sites/" + sid + "/lists/Propostas/items/" + id + "?expand=fields");
      propMap[id] = fresh;
      const i = lastPayload.propostas.findIndex(x => String(x.id) === String(id));
      if (i >= 0) lastPayload.propostas[i] = fresh;
      return fresh;
    }

    // ===================== MODAL: MOTIVO DA PERDA =====================
    // select com os choices REAIS de Propostas.Motivo_Perda (EG.listColumns);
    // valor já gravado fora da lista é PRESERVADO como opção extra. Se a coluna
    // não for Choice (ou não tiver choices), cai em texto livre para não travar.
    function motivoSelectHtml(atual, idCampo) {
      const a = atual || "";
      if (motivoPerdaChoices.length) {
        const ops = motivoPerdaChoices.slice();
        if (a && !ops.includes(a)) ops.unshift(a); // preserva valor fora da lista
        return '<select id="' + idCampo + '"><option value="">— selecione —</option>' +
          ops.map(o => '<option value="' + esc(o) + '"' + (o === a ? " selected" : "") + ">" + esc(o) + "</option>").join("") + "</select>";
      }
      return '<input id="' + idCampo + '" type="text" value="' + esc(a) + '" maxlength="255" />';
    }

    let perdaCtx = null; // { p, etapaAnterior } enquanto o mini-modal está aberto

    function abrirModalPerda(p, etapaAnterior) {
      perdaCtx = { p, etapaAnterior };
      // otimista: o card já aparece em "Perdido" (salvando…) enquanto o motivo é preenchido
      p.fields.Etapa_Pipeline = "Perdido";
      renderBoard(etapaChoices, lastPayload.propostas);
      marcarCard(p.id, "salvando", true);
      $("perdaSub").textContent = (p.fields.Title || p.id) + " — informe o motivo da perda para confirmar o movimento.";
      $("perdaMotivoWrap").innerHTML = motivoSelectHtml(p.fields.Motivo_Perda, "perdaMotivo");
      $("perdaDescricao").value = p.fields.Descricao_Motivo_Perda || "";
      $("perdaConcorrente").value = p.fields.Concorrente || "";
      $("perdaErro").hidden = true;
      $("perdaBg").hidden = false;
      const m = $("perdaMotivo");
      if (m) { m.addEventListener("change", atualizarDescricaoMotivoVisivel); m.focus && m.focus(); }
      atualizarDescricaoMotivoVisivel();
    }

    // mostra/esconde "Descrição do motivo" conforme o select — só "Outro" exige.
    function atualizarDescricaoMotivoVisivel() {
      const m = $("perdaMotivo");
      const wrap = $("perdaDescricaoWrap");
      if (!m || !wrap) return;
      wrap.hidden = !exigeDescricaoMotivo(m.value);
    }

    // comRollback=true (cancelar/Esc): o card volta à coluna de origem
    function fecharModalPerda(comRollback) {
      $("perdaBg").hidden = true;
      if (!perdaCtx) return;
      const ctx = perdaCtx; perdaCtx = null;
      if (comRollback) {
        ctx.p.fields.Etapa_Pipeline = ctx.etapaAnterior;
        renderBoard(etapaChoices, lastPayload.propostas);
        setStatus("Movimento cancelado — " + (ctx.p.fields.Title || ctx.p.id) + " permanece em " + (ctx.etapaAnterior || "(sem etapa)") + ".");
      }
    }

    $("perdaCancelar").onclick = () => fecharModalPerda(true);
    $("perdaBg").addEventListener("click", (e) => { if (e.target === $("perdaBg")) fecharModalPerda(true); });
    $("perdaConfirmar").onclick = async () => {
      if (!perdaCtx) return;
      const motivo = ($("perdaMotivo").value || "").trim();
      if (!motivo) { $("perdaErro").textContent = "Informe o motivo da perda (ou cancele o movimento)."; $("perdaErro").hidden = false; return; }
      const descricao = $("perdaDescricao").value.trim();
      if (exigeDescricaoMotivo(motivo) && !descricao) {
        $("perdaErro").textContent = "Motivo \"Outro\" exige a descrição do motivo.";
        $("perdaErro").hidden = false;
        $("perdaDescricao").focus();
        return;
      }
      const ctx = perdaCtx; perdaCtx = null;
      const concorrente = $("perdaConcorrente").value.trim();
      // lock explícito: botões travados durante a chamada, liberados no finally
      // (mesmo padrão de indConfirmar) — o modal só fecha depois, sucesso ou
      // falha; falha já é comunicada no board (rollback + pulso vermelho +
      // status bar), então reabrir o modal de novo não agrega nada aqui.
      const btnOk = $("perdaConfirmar"), btnCancel = $("perdaCancelar");
      btnOk.disabled = true; btnCancel.disabled = true; btnOk.textContent = "Confirmando…";
      try {
        // desfaz o otimista local — gravarMovimento refaz (otimista + PATCH + rollback se falhar)
        ctx.p.fields.Etapa_Pipeline = ctx.etapaAnterior;
        // Motivo_Perda/Concorrente/Descricao_Motivo_Perda: dono da escrita = esta tela (F5);
        // "" é omitido do PATCH (corpoMovimento já filtra vazio/null)
        const camposExtras = { Motivo_Perda: motivo, Concorrente: concorrente };
        if (exigeDescricaoMotivo(motivo)) camposExtras.Descricao_Motivo_Perda = descricao;
        await gravarMovimento(ctx.p, "Perdido", ctx.etapaAnterior, camposExtras);
      } finally {
        btnOk.disabled = false; btnCancel.disabled = false; btnOk.textContent = "Confirmar perda";
        $("perdaBg").hidden = true;
      }
    };

    // ===================== DRAWER DE DETALHE =====================
    board.addEventListener("click", (ev) => {
      const card = ev.target.closest(".card"); if (!card) return;
      const p = propMap[card.dataset.id]; if (p) openDrawer(p);
    });
    $("overlay").onclick = closeDrawer;
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (!$("perdaBg").hidden) { fecharModalPerda(true); return; }
      if (!$("indBg").hidden) { fecharModalIndicacao(); return; }
      closeDrawer();
    });

    function row(label, value) { return value == null || value === "" ? "" : "<dt>" + esc(label) + "</dt><dd>" + esc(value) + "</dd>"; }

    // <input type=date> quer AAAA-MM-DD: extrai o dia em UTC do valor gravado
    // (par do meio-dia UTC usado na gravação — mesmo dia em qualquer fuso BR)
    function opDataInput(s) {
      if (!s) return "";
      const d = new Date(s);
      if (isNaN(d)) return "";
      return d.toISOString().slice(0, 10);
    }

    function openDrawer(p) {
      const f = p.fields || {};
      const cor = window.etapaCor(f.Etapa_Pipeline);
      const ehPerdido = f.Etapa_Pipeline === "Perdido";
      const campos = [
        row("Cliente", cliNome(f)),
        row("Status", f.Status),
        row("Valor total", f.ValorTotal != null ? BRL(f.ValorTotal) : null),
        row("Valor serviços", f.Valor_Servico != null ? BRL(f.Valor_Servico) : null),
        row("Valor materiais", f.Valor_Materiais != null ? BRL(f.Valor_Materiais) : null),
        row("Margem prevista", f.Margem_Prevista_Pct != null ? f.Margem_Prevista_Pct + "%" : null),
        row("Descrição", f.Descricao),
        row("Emissão", fmtDate(f.DataEmissao)),
        row("Validade", fmtDate(f.DataValidade)),
        row("Entrada na etapa", fmtDate(f.Data_Entrada_Etapa)),
        row("Forma pgto", f.FormaPagamento),
        row("Prazo execução", f.PrazoExecucao),
        row("Probabilidade", f.Probabilidade_Fechamento != null ? f.Probabilidade_Fechamento + "%" : null),
        row("Responsável", f.Responsavel_Principal),
        row("Próxima ação", f.Proxima_Acao),
        row("Data próx. ação", fmtDate(f.Data_Proxima_Acao)),
        row("Motivo da perda", ehPerdido ? f.Motivo_Perda : null),
        row("Concorrente", ehPerdido ? f.Concorrente : null),
        row("Origem do lead", f.Origem_Lead),
        row("Observações", f.Observacoes)
      ].join("");
      // Edição rápida de operação (F5). Donos de escrita nesta tela:
      // Responsavel_Principal, Proxima_Acao, Data_Proxima_Acao (+ Motivo_Perda se Perdido).
      const opHtml =
        '<div class="op-block">' +
          '<div class="op-title">Operação</div>' +
          '<label for="opResp">Responsável principal</label>' +
          '<input id="opResp" type="text" value="' + esc(f.Responsavel_Principal ?? "") + '" maxlength="255" />' +
          '<label for="opProx">Próxima ação</label>' +
          '<input id="opProx" type="text" value="' + esc(f.Proxima_Acao ?? "") + '" maxlength="255" />' +
          '<label for="opData">Data da próxima ação</label>' +
          '<input id="opData" type="date" value="' + esc(opDataInput(f.Data_Proxima_Acao)) + '" />' +
          (ehPerdido ? '<label for="opMotivo">Motivo da perda</label>' + motivoSelectHtml(f.Motivo_Perda, "opMotivo") : "") +
          '<div class="op-msg" id="opMsg" hidden></div>' +
          '<button id="opSalvar" type="button">Salvar operação</button>' +
        "</div>";
      $("drawer").innerHTML =
        '<div class="drawer-head">' +
          '<div class="t">' +
            '<div class="num">' + esc(f.Title ?? "(sem número)") + "</div>" +
            '<span class="etapa" style="background:' + esc(cor) + '">' + esc(f.Etapa_Pipeline ?? "(sem etapa)") + "</span>" +
          "</div>" +
          '<button class="x" id="drawerClose" type="button">Fechar ✕</button>' +
        "</div>" +
        '<div class="drawer-body">' +
          "<dl>" + campos + "</dl>" +
          opHtml +
        "</div>";
      $("drawerClose").onclick = closeDrawer;
      $("opSalvar").onclick = () => salvarOperacao(p);
      $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
      $("overlay").classList.add("open");
    }
    function closeDrawer() {
      $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true");
      $("overlay").classList.remove("open");
    }

    // PATCH mínimo do bloco de operação: só campos alterados; campo esvaziado
    // NÃO é gravado ("" nunca vai ao Graph — regra do repo; limpar valor é
    // operação de outra tela/decisão). Releitura pós-gravação + re-render.
    async function salvarOperacao(p) {
      const f = p.fields || {};
      const body = {};
      const resp = $("opResp").value.trim();
      if (resp && resp !== (f.Responsavel_Principal || "")) body.Responsavel_Principal = resp;
      const prox = $("opProx").value.trim();
      if (prox && prox !== (f.Proxima_Acao || "")) body.Proxima_Acao = prox;
      const data = $("opData").value; // AAAA-MM-DD do input date
      if (data && data !== opDataInput(f.Data_Proxima_Acao)) body.Data_Proxima_Acao = data + "T12:00:00Z"; // meio-dia UTC: mesmo dia em qualquer fuso BR
      const elMotivo = $("opMotivo"); // só existe quando etapa = Perdido
      if (elMotivo) {
        const m = (elMotivo.value || "").trim();
        if (m && m !== (f.Motivo_Perda || "")) body.Motivo_Perda = m;
      }
      const msg = $("opMsg");
      if (!Object.keys(body).length) { msg.textContent = "Nada para salvar."; msg.className = "op-msg"; msg.hidden = false; return; }
      const btn = $("opSalvar"); btn.disabled = true;
      msg.textContent = "Salvando…"; msg.className = "op-msg"; msg.hidden = false;
      try {
        await EG.patchItemFields("Propostas", p.id, body);
        const fresh = await relerProposta(p.id);           // releitura pós-gravação
        renderBoard(etapaChoices, lastPayload.propostas);  // F5 aparece nos cards na hora
        openDrawer(fresh);                                 // drawer re-renderizado com o estado do servidor
        setStatus("✔ Operação salva em " + ((fresh.fields || {}).Title || p.id) + ".");
      } catch (e) {
        btn.disabled = false;
        msg.textContent = "Falha ao salvar: " + e.message; msg.className = "op-msg err"; msg.hidden = false;
      }
    }

    // ===================== + INDICAÇÃO (F5) =====================
    $("btnIndicacao").onclick = () => {
      ["indRazao", "indDoc", "indContato", "indObs"].forEach(id => { $(id).value = ""; });
      $("indErro").hidden = true;
      $("indConfirmar").disabled = false; $("indConfirmar").textContent = "Registrar indicação";
      $("indBg").hidden = false;
      $("indRazao").focus();
    };
    function fecharModalIndicacao() { $("indBg").hidden = true; }
    $("indCancelar").onclick = fecharModalIndicacao;
    $("indBg").addEventListener("click", (e) => { if (e.target === $("indBg")) fecharModalIndicacao(); });

    // Origem_Lead da FILA tem enum próprio (Outbound|Inbound|Licitações|Referrals —
    // difere do enum de Propostas). Lemos os choices REAIS via EG.listColumns:
    // preferimos "Indicação" se o dono criar esse choice; hoje o mais próximo é
    // "Referrals" (a promoção make:5803496 já traduz Referrals→Indicação na
    // Proposta — INVENTARIO-AS-IS §2). Sem candidato: omitimos o campo em vez
    // de gravar rótulo inválido.
    async function origemLeadIndicacao() {
      if (origemLeadFila === null) {
        try {
          const cols = await EG.listColumns("Fila_Auditoria_Leads");
          const col = (cols || []).find(c => c.name === "Origem_Lead");
          origemLeadFila = col && col.choice && Array.isArray(col.choice.choices) ? col.choice.choices : [];
        } catch (e) { origemLeadFila = []; console.warn("[kanban] choices de Fila_Auditoria_Leads.Origem_Lead indisponíveis:", e.message); }
      }
      const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
      const exato = origemLeadFila.find(c => norm(c) === "indicacao");
      if (exato) return exato;
      const referrals = origemLeadFila.find(c => norm(c) === "referrals");
      if (referrals) return referrals;
      return origemLeadFila.find(c => norm(c).includes("indic") || norm(c).includes("referr")) || null;
    }

    $("indConfirmar").onclick = async () => {
      const razao = $("indRazao").value.trim();
      if (!razao) { $("indErro").textContent = "Razão social / Nome é obrigatório."; $("indErro").hidden = false; $("indRazao").focus(); return; }
      const btn = $("indConfirmar");
      btn.disabled = true; btn.textContent = "Registrando…"; $("indErro").hidden = true;
      try {
        let quem = window.currentUser;
        if (!quem) { try { quem = await EG.me(); } catch { quem = { nome: (EG.getAccount() || {}).username || "?", email: "" }; } }
        const origem = await origemLeadIndicacao();
        const doc = $("indDoc").value.trim();
        const contato = $("indContato").value.trim();
        const obs = $("indObs").value.trim();
        // Dados_Brutos: JSON do form + rastro de quem registrou (padrão da fila)
        const dadosBrutos = {
          razao_social_nome: razao,
          cnpj_cpf: doc,
          contato: contato,
          observacao: obs,
          origem: "indicacao-manual",
          registradoPor: (quem.nome || "") + (quem.email ? " <" + quem.email + ">" : ""),
          em: new Date().toISOString()
        };
        // Donos de escrita (esta tela, criação da indicação manual):
        //   Title / RazaoSocial_Nome / Dados_Brutos / Origem_Lead / Status_Processamento.
        // NÃO tocamos Status_Auditoria: a indicação entra no fluxo NORMAL de
        // AUDITORIA humana da fila — quem aprova/rejeita é o revisor, não esta
        // tela (os 3 status são ortogonais, cada escritor toca só o seu).
        // E NÃO criamos Proposta: proposta só nasce via promoção pós-auditoria.
        const fields = {
          Title: razao,
          RazaoSocial_Nome: razao,
          Dados_Brutos: JSON.stringify(dadosBrutos),
          Status_Processamento: "Persistido" // captura concluída — classificação (F2) vem depois
        };
        if (origem) fields.Origem_Lead = origem; // omitido se não houver choice compatível
        await EG.createItem("Fila_Auditoria_Leads", fields);
        fecharModalIndicacao();
        setStatus("✔ Indicação registrada na fila de auditoria: " + razao + ".");
      } catch (e) {
        $("indErro").textContent = "Falha ao registrar: " + e.message; $("indErro").hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = "Registrar indicação";
      }
    };

    /* Exposto para exercitar as regras sem login (a tela não tinha global). */
    window.IDX = { classeDataAcao, opDataInput, movimentoNulo, exigeMotivoPerda, exigeDescricaoMotivo,
                   corpoMovimento, ETAPAS_FECHADAS, esc };

    /* =========================================================================
       SUITE DE ASSERÇÃO (item 12) — IDX.assertRegras(). Regras protegidas:
       (1) "Perdido" NÃO se alcança por arrasto direto — exige motivo (senão o
           pipeline perde a razão da derrota e o funil vira número cego);
       (2) arrastar para a mesma coluna (ou para a coluna sintética "(sem
           etapa)") não é movimento: não pode gerar PATCH nem recarimbar o SLA;
       (3) todo movimento REAL recarimba Data_Entrada_Etapa (é o relógio do SLA);
       (4) o corpo do PATCH NUNCA leva "" — campo vazio é omitido;
       (5) data de próxima ação ao MEIO-DIA UTC, para o dia não escorregar no
           fuso brasileiro; e as faixas de urgência vencida/hoje/futura.
       ========================================================================= */
    window.IDX.assertRegras = function () {
      const falhas = []; let total = 0;
      const ok = (cond, regra) => { total++; if (!cond) falhas.push(regra); };

      // ---- (1) e (2) o que é (e o que não é) um movimento ----
      ok(exigeMotivoPerda("Perdido") === true,
        "'Perdido' tem de exigir motivo (mini-modal antes de gravar)");
      ok(exigeMotivoPerda("Ganho") === false && exigeMotivoPerda("Lead Novo") === false,
        "só 'Perdido' exige motivo — as demais etapas movem por arrasto direto");
      ok(exigeDescricaoMotivo("Outro") === true,
        "motivo 'Outro' tem de exigir descrição própria (senão o motivo real não fica registrado)");
      ok(exigeDescricaoMotivo("Preço") === false && exigeDescricaoMotivo("Concorrência") === false &&
         exigeDescricaoMotivo("") === false && exigeDescricaoMotivo(null) === false,
        "só 'Outro' exige descrição — os demais motivos (e vazio) não travam o campo extra");
      ok(movimentoNulo("Ganho", "Ganho") === true,
        "arrastar para a MESMA coluna não é movimento (não pode gerar PATCH)");
      ok(movimentoNulo("Ganho", "") === true && movimentoNulo("Ganho", null) === true &&
         movimentoNulo("Ganho", undefined) === true,
        "soltar na coluna sintética '(sem etapa)' não é movimento — ela não é destino válido");
      ok(movimentoNulo("Lead Novo", "Qualificado") === false,
        "mudança real de etapa TEM de ser reconhecida como movimento");

      // ---- (3) e (4) o corpo do PATCH ----
      const antes = Date.now();
      const body = corpoMovimento("Qualificado", null);
      const carimbo = new Date(body.Data_Entrada_Etapa).getTime();
      ok(body.Etapa_Pipeline === "Qualificado",
        "o corpo leva a etapa de destino");
      ok(!isNaN(carimbo) && carimbo >= antes - 1000 && carimbo <= Date.now() + 1000,
        "todo movimento recarimba Data_Entrada_Etapa com AGORA (é o relógio do SLA do pipeline)");
      const comExtras = corpoMovimento("Perdido", { Motivo_Perda: "Preço", Concorrente: "", Observacoes: null, Outro: undefined });
      ok(comExtras.Motivo_Perda === "Preço",
        "campo extra preenchido entra no corpo");
      ok(!("Concorrente" in comExtras) && !("Observacoes" in comExtras) && !("Outro" in comExtras),
        "campo extra vazio/nulo é OMITIDO — o corpo nunca pode gravar \"\" por cima do servidor");
      ok(Object.values(comExtras).every(v => v !== "" && v != null),
        "nenhum valor \"\" ou nulo pode sobrar no corpo do PATCH");
      ok(Object.keys(corpoMovimento("Ganho", {})).length === 2,
        "sem extras o PATCH é mínimo: só etapa + carimbo do SLA");

      // ---- (5) datas ----
      ok(opDataInput("2026-08-04T12:00:00Z") === "2026-08-04",
        "opDataInput: o dia gravado ao meio-dia UTC é exibido como o MESMO dia");
      ok(opDataInput("2026-08-04T00:00:00Z") === "2026-08-04",
        "opDataInput: campo DateOnly (00:00Z) também devolve o dia certo");
      ok(opDataInput("") === "" && opDataInput(null) === "" && opDataInput("lixo") === "",
        "opDataInput: sem data (ou data ilegível) devolve '' — nunca 'Invalid Date'");

      const dia = (n) => { const d = new Date(); d.setDate(d.getDate() + n);
        const p = (x) => String(x).padStart(2, "0");
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T12:00:00Z"; };
      ok(classeDataAcao(dia(-1)) === "vencida",
        "próxima ação de ontem tem de aparecer como VENCIDA");
      ok(classeDataAcao(dia(0)) === "hoje",
        "próxima ação de hoje tem de aparecer como HOJE (não vencida)");
      ok(classeDataAcao(dia(1)) === "",
        "próxima ação futura não pode ser marcada como urgente");
      ok(classeDataAcao("") === "" && classeDataAcao(null) === "" && classeDataAcao("lixo") === "",
        "sem data não há urgência — e data ilegível não pode virar 'vencida'");

      // ---- etapas fechadas: só elas dispensam próxima ação ----
      ok(ETAPAS_FECHADAS.length === 2 && ETAPAS_FECHADAS.indexOf("Ganho") >= 0 && ETAPAS_FECHADAS.indexOf("Perdido") >= 0,
        "as etapas FECHADAS são exatamente Ganho e Perdido (só elas dispensam próxima ação)");
      ok(ETAPAS_FECHADAS.indexOf("Lead Novo") === -1,
        "nenhuma etapa ativa pode ser tratada como fechada (senão o 'sem próxima ação' some do card)");

      // ---- escape de HTML nos cards (dado do cliente nunca vira markup) ----
      ok(esc("<img src=x onerror=alert(1)>").indexOf("<") === -1 && esc(null) === "",
        "esc: conteúdo vindo do servidor é escapado antes de virar card");

      const r = { ok: falhas.length === 0, total, falhas };
      console.log("IDX.assertRegras:", JSON.stringify(r, null, 2));
      return r;
    };

    boot().catch(e => setStatus("Erro ao iniciar (MSAL): " + e.message, "err"));
  </script>
</body>
</html>
